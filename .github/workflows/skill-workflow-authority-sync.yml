name: Skill Workflow Authority Sync

on:
  push:
    branches:
      - "work/skill-workflow-sync-1f9b48b"
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    name: skill-sync-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout DoctorCode
        uses: actions/checkout@v4
        with:
          path: doctorcode
          persist-credentials: false
      - name: Checkout Skill Workflow authority
        uses: actions/checkout@v4
        with:
          repository: maxqstudio/Skill_Workflow
          ref: 1f9b48b9a3bf29bf2929a7d38b1ec9a645dfb720
          path: skill-workflow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify vendored files match authority byte-for-byte
        shell: python
        run: |
          from pathlib import Path
          pairs = [
              ("doctorcode/.workflow/tools/sync_project_truth.py", "skill-workflow/scripts/sync_project_truth.py"),
              ("doctorcode/.workflow/tools/selftest_strict_project_workflow.py", "skill-workflow/scripts/selftest_strict_project_workflow.py"),
          ]
          for left, right in pairs:
              assert Path(left).read_bytes() == Path(right).read_bytes(), f"VENDORED_MISMATCH: {left}"
          print("VENDORED_AUTHORITY_MATCH=PASS")
      - name: Run upstream STRICT selftest
        working-directory: skill-workflow
        run: python scripts/selftest_strict_project_workflow.py
      - name: Run DoctorCode Project Truth sync
        run: python doctorcode/.workflow/tools/sync_project_truth.py --root doctorcode
      - name: Verify deterministic acceptance JSON LF
        shell: python
        run: |
          from pathlib import Path
          data = Path("doctorcode/.workflow/acceptance.json").read_bytes()
          assert b"\r\n" not in data, "acceptance.json contains CRLF"
          assert data.endswith(b"\n"), "acceptance.json missing final LF"
          print("DETERMINISTIC_JSON_LF=PASS")
      - name: Report generated truth drift
        shell: bash
        run: git -C doctorcode diff --name-only

  publish-generated:
    if: github.actor != 'github-actions[bot]'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/skill-workflow-sync-1f9b48b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Synchronize generated Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .
      - name: Commit generated truth
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "PROJECT_TRUTH_DRIFT=NONE"
            exit 0
          fi
          git add .workflow/acceptance.json .workflow/generated docs
          git commit -m "docs: synchronize Skill Workflow authority truth"
          git push origin HEAD:work/skill-workflow-sync-1f9b48b
