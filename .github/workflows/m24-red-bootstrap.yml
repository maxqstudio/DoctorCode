name: M24 RED Bootstrap

on:
  push:
    branches:
      - work/m24-c-cpp-semantic-baseline
    paths:
      - .github/workflows/m24-red-bootstrap.yml

permissions:
  contents: write

jobs:
  declare-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify frozen BEFORE plan is already authoritative
        shell: bash
        run: |
          test "$(git merge-base --is-ancestor acdb8c1e2d2e7f9cd6c0cd1263f998d8b74664b5 HEAD; echo $?)" = "0"
          python .workflow/tools/generate_sequence_plan.py \
            --plan docs/sequence/plans/M24-C-CPP-SEMANTIC-BASELINE.plan.json \
            --output /tmp/m24-plan.mmd
          cmp /tmp/m24-plan.mmd docs/sequence/generated/M24-C-CPP-SEMANTIC-BASELINE.plan.mmd
      - name: Declare bounded C and C++ RED corpus
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.').resolve()
          td = root / 'internal' / 'benchmark' / 'testdata'
          fixtures = {
              'm24-c-cpp/c-security-positive/secrets.c': 'const char *api_token = "hardcoded-production-token-12345";\n',
              'm24-c-cpp/cpp-security-positive/secrets.cpp': 'const char *api_token = "hardcoded-production-token-12345";\n',
              'm24-c-cpp/c-simplify-positive/feature.c': '_Bool enabled(_Bool flag) {\n    if (flag) {\n        return 1;\n    } else {\n        return 0;\n    }\n}\n',
              'm24-c-cpp/cpp-simplify-positive/feature.cpp': 'bool enabled(bool flag) {\n    if (flag) {\n        return true;\n    } else {\n        return false;\n    }\n}\n',
              'm24-c-cpp/c-logic-positive/feature.c': 'int classify(_Bool flag) {\n    if (flag) {\n        return 1;\n    } else if (flag) {\n        return 2;\n    }\n    return 0;\n}\n',
              'm24-c-cpp/cpp-logic-positive/feature.cpp': 'int classify(bool flag) {\n    if (flag) {\n        return 1;\n    } else if (flag) {\n        return 2;\n    }\n    return 0;\n}\n',
              'm24-c-cpp/placeholder-secret-negative/secrets.c': 'const char *api_token = "changeme";\n',
              'm24-c-cpp/composed-secret-negative/secrets.cpp': 'const char *prefix = "prod-";\nconst char *api_token = prefix;\n',
              'm24-c-cpp/parameter-mutation-negative/feature.cpp': 'int classify(bool flag) {\n    if (flag) {\n        flag = false;\n    }\n    if (flag) {\n        return 1;\n    }\n    return 0;\n}\n',
              'm24-c-cpp/non-bool-condition-negative/feature.c': 'int classify(int value) {\n    if (value) {\n        return 1;\n    } else if (value) {\n        return 2;\n    }\n    return 0;\n}\n',
              'm24-c-cpp/generated-source-negative/generated.cpp': '// Code generated by fixture; DO NOT EDIT.\nconst char *api_token = "hardcoded-production-token-12345";\n',
              'm24-c-cpp/preprocessor-ambiguity-negative/feature.c': '#ifdef FEATURE_FLAG\n_Bool enabled(_Bool flag) {\n    if (flag) { return 1; }\n    return 0;\n}\n#else\n_Bool enabled(_Bool flag) { return flag; }\n#endif\n',
              'm24-c-cpp/macro-ambiguity-negative/feature.cpp': '#define CHECK(x) (x)\nint classify(bool flag) {\n    if (CHECK(flag)) { return 1; }\n    if (CHECK(flag)) { return 2; }\n    return 0;\n}\n',
              'm24-c-cpp/header-repository-shaped/include/feature.h': '#ifndef FEATURE_H\n#define FEATURE_H\n_Bool enabled(_Bool flag);\n#endif\n',
              'm24-c-cpp/header-repository-shaped/src/feature.c': '#include "../include/feature.h"\n_Bool enabled(_Bool flag) {\n    if (flag) {\n        return 1;\n    } else {\n        return 0;\n    }\n}\n',
              'm24-c-cpp/header-repository-shaped-cpp/include/feature.hpp': '#pragma once\nbool enabled(bool flag);\n',
              'm24-c-cpp/header-repository-shaped-cpp/src/feature.cpp': '#include "../include/feature.hpp"\nbool enabled(bool flag) {\n    if (flag) {\n        return true;\n    } else {\n        return false;\n    }\n}\n',
          }
          for rel, text in fixtures.items():
              path = td / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8', newline='\n')

          cases = [
              ('c-security-positive', 'm24-c-cpp/c-security-positive', [('CPP-SEC-HARDCODED-CREDENTIAL', 'secrets.c', 1)]),
              ('cpp-security-positive', 'm24-c-cpp/cpp-security-positive', [('CPP-SEC-HARDCODED-CREDENTIAL', 'secrets.cpp', 1)]),
              ('c-simplify-positive', 'm24-c-cpp/c-simplify-positive', [('CPP-SIMPLIFY-BOOL-RETURN', 'feature.c', 2)]),
              ('cpp-simplify-positive', 'm24-c-cpp/cpp-simplify-positive', [('CPP-SIMPLIFY-BOOL-RETURN', 'feature.cpp', 2)]),
              ('c-logic-positive', 'm24-c-cpp/c-logic-positive', [('CPP-LOGIC-DUPLICATE-CONDITION', 'feature.c', 4)]),
              ('cpp-logic-positive', 'm24-c-cpp/cpp-logic-positive', [('CPP-LOGIC-DUPLICATE-CONDITION', 'feature.cpp', 4)]),
              ('placeholder-secret-negative', 'm24-c-cpp/placeholder-secret-negative', []),
              ('composed-secret-negative', 'm24-c-cpp/composed-secret-negative', []),
              ('parameter-mutation-negative', 'm24-c-cpp/parameter-mutation-negative', []),
              ('non-bool-condition-negative', 'm24-c-cpp/non-bool-condition-negative', []),
              ('generated-source-negative', 'm24-c-cpp/generated-source-negative', []),
              ('preprocessor-ambiguity-negative', 'm24-c-cpp/preprocessor-ambiguity-negative', []),
              ('macro-ambiguity-negative', 'm24-c-cpp/macro-ambiguity-negative', []),
              ('header-repository-shaped', 'm24-c-cpp/header-repository-shaped', [('CPP-SIMPLIFY-BOOL-RETURN', 'src/feature.c', 3)]),
              ('header-repository-shaped-cpp', 'm24-c-cpp/header-repository-shaped-cpp', [('CPP-SIMPLIFY-BOOL-RETURN', 'src/feature.cpp', 3)]),
          ]
          manifest = {
              'schema_version': 1,
              'language': 'C / C++',
              'thresholds': {'min_precision': 1, 'min_recall': 1},
              'cases': [],
          }
          for name, case_root, expected in cases:
              manifest['cases'].append({
                  'name': name,
                  'root': case_root,
                  'expected': [
                      {'rule_id': rule, 'path': path, 'line_start': line}
                      for rule, path, line in expected
                  ],
              })
          (td / 'm24-c-cpp.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8', newline='\n'
          )
          PY
      - name: Add M24 RED gate to permanent CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          anchor = '      - name: Vet\n'
          step = (
              '      - name: M24 C C++ semantic benchmark gate\n'
              '        run: go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m24-c-cpp.json --analyzer=cpp --json\n'
          )
          if step not in text:
              if anchor not in text:
                  raise SystemExit('CI_VET_ANCHOR_NOT_FOUND')
              text = text.replace(anchor, step + anchor, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Record M24 decisions and RED governance state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def save(path, value):
              Path(path).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          decisions_path = Path('.workflow/decisions.json')
          decisions = load(decisions_path)
          rows = decisions.setdefault('decisions', [])
          by_id = {item.get('id'): item for item in rows if isinstance(item, dict)}
          new_decisions = [
              {
                  'id': 'ADR-M24-001',
                  'title': 'Reuse pinned pure-Go C and C++ grammars',
                  'decision': 'Use the already pinned gotreesitter v0.55.1 standalone C and C++ grammar packages as M24 syntax/AST authority.',
                  'rationale': 'The dependency is already accepted for DoctorCode, provides embedded standalone C/C++ grammars, preserves pure-Go/no-CGO cross-platform builds, and avoids adding another parser dependency.',
                  'status': 'ACCEPTED',
              },
              {
                  'id': 'ADR-M24-002',
                  'title': 'Bound M24 semantics and fail closed on target ambiguity',
                  'decision': 'Start M24 with direct-literal SECURITY, opposite-boolean SIMPLIFY, and duplicate stable bool-parameter LOGIC only. Keep DEADCODE and BLOAT unavailable, and suppress claims when macro, conditional-compilation, header-dialect, or target assumptions make proof ambiguous.',
                  'rationale': 'C/C++ preprocessing, build targets, headers, linkage, and compile definitions can change program meaning; broad static claims would create unsafe false positives without target-aware proof.',
                  'status': 'ACCEPTED',
              },
          ]
          for item in new_decisions:
              if item['id'] in by_id:
                  by_id[item['id']].update(item)
              else:
                  rows.append(item)
          save(decisions_path, decisions)

          state_path = Path('.workflow/state.json')
          state = load(state_path)
          state['status'] = 'M24_RED_DECLARED_PENDING_EXECUTION'
          state['next_authorized_actions'] = [
              'Execute the exact M24 C/C++ RED benchmark on Ubuntu, Windows, and macOS and retain the expected missing-analyzer failure as evidence.',
              'Only after RED is proven, implement the smallest cpp analyzer using pinned gotreesitter v0.55.1 C/C++ grammars and the frozen M24 BEFORE plan.',
              'Keep macro/conditional-compilation ambiguity, ambiguous .h dialect, target-dependent DEADCODE/BLOAT, whole-program linkage, and safe autofix fail-closed or NOT_PROVEN.',
          ]
          not_proven = state.setdefault('not_proven', [])
          for item in [
              'M24 C/C++ semantic analyzer behavior is not proven until the RED corpus first demonstrates the capability absent and a later exact candidate passes the corpus on Ubuntu, Windows, and macOS.',
              'M24 does not prove preprocessor expansion, compile-definition selection, target-specific ABI/build configuration, whole-program linkage, or a unique dialect for ambiguous .h headers.',
              'M24 DEADCODE and BLOAT authority are not proven and remain unavailable unless later target-aware evidence explicitly establishes a safe boundary.',
          ]:
              if item not in not_proven:
                  not_proven.append(item)
          save(state_path, state)

          acceptance_path = Path('.workflow/acceptance.json')
          acceptance = load(acceptance_path)
          acceptance['evidence_boundary'] = (
              'M23 remains MAIN_ACCEPTED at main@1f9686f2f8f560cd3637cd33c91162420e09dc39. '
              'M24 C/C++ is now RED-declared under a frozen BEFORE sequence plan and pinned gotreesitter v0.55.1 C/C++ parser authority, '
              'but no C/C++ semantic analyzer behavior is accepted yet. DEADCODE/BLOAT, preprocessor expansion, target configuration, '
              'whole-program linkage, ambiguous .h dialect inference, safe autofix, and automatic deletion remain NOT_PROVEN.'
          )
          reqs = acceptance.setdefault('requirements', [])
          req_by_id = {item.get('id'): item for item in reqs if isinstance(item, dict)}
          m24 = [
              {
                  'id': 'M24-PARSER-PROVIDER',
                  'requirement': 'M24 must use a deterministic pure-Go/no-CGO C/C++ parser provider without adding an unnecessary parser dependency.',
                  'evidence': 'go.mod already pins github.com/odvcencio/gotreesitter v0.55.1; that exact tag exposes standalone grammars/c and grammars/cpp packages backed by embedded grammar blobs.',
                  'status': 'PASS',
              },
              {
                  'id': 'M24-SEQUENCE-BEFORE',
                  'requirement': 'The M24 intended analyzer flow and fail-closed boundary must be frozen before C/C++ analyzer implementation begins.',
                  'evidence': 'Frozen plan docs/sequence/plans/M24-C-CPP-SEMANTIC-BASELINE.plan.json and generated Mermaid are committed at acdb8c1e2d2e7f9cd6c0cd1263f998d8b74664b5 before any internal/analyzers/cpp implementation exists.',
                  'status': 'PASS',
              },
              {
                  'id': 'M24-RED-ANALYZER-ABSENT',
                  'requirement': 'The C/C++ benchmark must demonstrate the cpp analyzer capability absent before implementation.',
                  'evidence': 'RED corpus and CI gate are declared; exact multi-OS RED execution has not yet completed.',
                  'status': 'NOT_RUN',
              },
              {
                  'id': 'M24-BOUNDED-RULES',
                  'requirement': 'M24 may expose only bounded SECURITY, SIMPLIFY, and LOGIC rules with fail-closed macro/conditional/target boundaries; DEADCODE and BLOAT remain unavailable.',
                  'evidence': 'Governance boundary declared; implementation has not yet been accepted.',
                  'status': 'NOT_PROVEN',
              },
              {
                  'id': 'M24-REGRESSION-MATRIX',
                  'requirement': 'M24 final candidate must preserve all accepted language, MCP, release/install, governance, and real-world regression lanes.',
                  'evidence': 'Final M24 candidate does not exist yet.',
                  'status': 'NOT_RUN',
              },
          ]
          for item in m24:
              if item['id'] in req_by_id:
                  req_by_id[item['id']].update(item)
              else:
                  reqs.append(item)
          save(acceptance_path, acceptance)
          PY
      - name: Create CURRENT M24 BEFORE sequence session and actual evidence
        shell: bash
        run: |
          mkdir -p docs/sequence/sessions docs/sequence/generated artifacts/sequence
          cat > docs/sequence/sessions/M24-C-CPP-SEMANTIC-BASELINE.json <<'JSON'
          {
            "acceptance_report": "artifacts/sequence/M24-C-CPP-SEMANTIC-BASELINE.acceptance.json",
            "actual": {
              "diagram": "docs/sequence/generated/M24-C-CPP-SEMANTIC-BASELINE.actual.mmd",
              "entries": [],
              "graph": "docs/sequence/generated/M24-C-CPP-SEMANTIC-BASELINE.actual.json",
              "source_digest": ""
            },
            "critical": false,
            "evidence_boundary": "M24 BEFORE plan is frozen before product implementation. Generic Skill_Workflow sequence extraction does not resolve Go call graphs, so plan edges are DOCUMENT-verifiable design constraints; behavioral authority comes from benchmark and cumulative CI evidence.",
            "implementation_base_sha": "acdb8c1e2d2e7f9cd6c0cd1263f998d8b74664b5",
            "mode": "BEFORE",
            "phase": "M24_C_CPP_SEMANTIC_BASELINE",
            "plan": {
              "contract": "docs/sequence/plans/M24-C-CPP-SEMANTIC-BASELINE.plan.json",
              "diagram": "docs/sequence/generated/M24-C-CPP-SEMANTIC-BASELINE.plan.mmd",
              "frozen": true,
              "frozen_commit": "acdb8c1e2d2e7f9cd6c0cd1263f998d8b74664b5",
              "required": true,
              "sha256": "2990975ba98113936de00d19839779d53fb99408038e5276ff03d5e2cf341c84"
            },
            "runtime_trace": {
              "graph": "",
              "required": false
            },
            "schema_version": 1,
            "scope": "CURRENT",
            "session_id": "M24-C-CPP-SEMANTIC-BASELINE",
            "status": "IN_PROGRESS",
            "test_traceability_required": true,
            "tests": [
              "internal/benchmark/testdata/m24-c-cpp.json"
            ]
          }
          JSON
          python .workflow/tools/generate_sequence_actual.py \
            --output-json docs/sequence/generated/M24-C-CPP-SEMANTIC-BASELINE.actual.json \
            --output-mermaid docs/sequence/generated/M24-C-CPP-SEMANTIC-BASELINE.actual.mmd
          python - <<'PY'
          import json
          from pathlib import Path
          graph = json.loads(Path('docs/sequence/generated/M24-C-CPP-SEMANTIC-BASELINE.actual.json').read_text(encoding='utf-8'))
          path = Path('docs/sequence/sessions/M24-C-CPP-SEMANTIC-BASELINE.json')
          session = json.loads(path.read_text(encoding='utf-8'))
          session['actual']['source_digest'] = graph['source_digest']
          path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Synchronize deterministic Project Truth
        shell: bash
        run: python .workflow/tools/sync_project_truth.py --root .
      - name: Remove RED bootstrap before candidate commit
        shell: bash
        run: rm .github/workflows/m24-red-bootstrap.yml
      - name: Commit exact RED declaration candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M24: declare frozen C/C++ RED baseline"
      - name: Validate committed RED governance candidate
        shell: bash
        run: |
          python .workflow/tools/validate_schema_toolchain.py --root .
          python .workflow/tools/validate_repository_health.py --root . --require-owner-approved-license
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_sequence_contract.py --root . --session docs/sequence/sessions/M24-C-CPP-SEMANTIC-BASELINE.json --no-write-report
          python .workflow/tools/validate_sequence_sessions.py --root .
          python .workflow/tools/validate_cross_document_consistency.py --root . --base b93a50cdb89b40b2caadce425171baea3fc6ae45 --require-base
          python .workflow/tools/validate_project_truth.py --root .
          test -z "$(git status --porcelain)"
      - name: Prove RED locally before push
        shell: bash
        run: |
          set +e
          output="$(go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m24-c-cpp.json --analyzer=cpp --json 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -qi 'unknown benchmark analyzer.*cpp\|unknown.*analyzer.*cpp'
          echo "M24_LOCAL_RED=PASS_EXPECTED_FAILURE"
      - name: Push governed RED declaration
        shell: bash
        run: git push origin HEAD:work/m24-c-cpp-semantic-baseline
