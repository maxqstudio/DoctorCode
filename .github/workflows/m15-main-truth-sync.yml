name: M15 Main Truth Sync

on:
  push:
    branches:
      - "work/m15-main-truth-sync"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/m15-main-truth-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Record M15 main accepted truth
        shell: python
        run: |
          import json
          from pathlib import Path

          MAIN_SHA = "b0677e43c3c5634dbdd856821c44fce7003c896d"

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, data):
              Path(path).write_bytes((json.dumps(data, indent=2, sort_keys=True) + "\n").encode("utf-8"))

          state = load(".workflow/state.json")
          state["status"] = "M15_MAIN_ACCEPTED"
          state["working_branch"] = "main"
          state["last_accepted_sha"] = MAIN_SHA
          state["last_accepted_branch"] = "main"
          state["next_authorized_actions"] = [
              "Proceed to M16 Thin MCP Adapter under the Owner directive to continue until DoctorCode is complete.",
              "Branch M16 only from the governance-normalized M15 main after exact closure acceptance.",
              "Keep MCP transport thin: expose DoctorCode CLI/core capabilities without duplicating detector, context, or verification algorithms.",
              "Preserve M15 product acceptance at " + MAIN_SHA + " and its exact post-merge evidence as immutable historical evidence."
          ]
          state["blocked_actions"] = [
              "Duplicating DoctorCode detector, context, or verification logic inside the MCP adapter.",
              "Granting MCP tools automatic mutation or safe-delete authority.",
              "Executing arbitrary repository-provided commands as DoctorCode verification authority.",
              "Starting release/install packaging before the thin MCP transport contract is accepted."
          ]
          additions = [
              "M15 Thin Skill Adapter merged through PR #16 to protected main at " + MAIN_SHA + ".",
              "Exact M15 main Governance Bootstrap run 36369855788 completed success.",
              "Exact M15 main Core CI run 36369855714 completed success on ubuntu-latest, windows-latest, and macos-latest.",
              "Exact M15 main M10 Python labels run 36369855718 completed success on all three operating systems.",
              "Exact M15 main M07 Python Real World run 36369855832 completed success on all three operating systems.",
              "Exact M15 main M06 Go labels run 36369855815 completed success on all three operating systems.",
              "Exact M15 main Real World Go Validation run 36369855765 completed success on all three operating systems."
          ]
          for item in additions:
              if item not in state["proven"]:
                  state["proven"].append(item)
          save(".workflow/state.json", state)

          acceptance = load(".workflow/acceptance.json")
          if not any(x.get("id") == "M15-MAIN-POST-MERGE" for x in acceptance["requirements"]):
              acceptance["requirements"].append({
                  "id": "M15-MAIN-POST-MERGE",
                  "requirement": "M15 must pass strict governance and every accepted product/regression lane on the exact protected-main merge SHA before M16 begins.",
                  "evidence": (
                      "At main@" + MAIN_SHA + ": Governance Bootstrap 36369855788, Core CI 36369855714, "
                      "M10 Python labels 36369855718, M07 Python Real World 36369855832, "
                      "M06 Go labels 36369855815, and Real World Go 36369855765 all completed success; "
                      "every matrix job passed on Linux, Windows, and macOS."
                  ),
                  "status": "PASS"
              })
          save(".workflow/acceptance.json", acceptance)

          changelog = load(".workflow/changelog.json")
          title = "M15 main accepted baseline"
          if not any(x.get("title") == title for x in changelog["entries"]):
              changelog["entries"].insert(0, {
                  "date": "2026-09-28",
                  "title": title,
                  "type": "acceptance",
                  "changes": [
                      "Merged FINAL_ACCEPTED M15 Thin Skill Adapter through PR #16 to protected main at " + MAIN_SHA + ".",
                      "Passed strict Governance Bootstrap on the exact main merge SHA.",
                      "Passed Core CI, bounded Python labels, pinned Python public-source validation, bounded Go labels, and pinned Go public-source validation on Linux, Windows, and macOS.",
                      "Authorized M16 Thin MCP Adapter while retaining DoctorCode CLI/core as the only detector, context, and verification authority."
                  ]
              })
          save(".workflow/changelog.json", changelog)

      - name: Synchronize generated Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .

      - name: Commit synchronized M15 main truth locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m15): synchronize accepted main truth"

      - name: Validate clean closure
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_cross_document_consistency.py --base b0677e43c3c5634dbdd856821c44fce7003c896d --require-base
          python .workflow/tools/validate_project_truth.py

      - name: Prepare connector-safe commit
        shell: bash
        run: |
          git reset --soft "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --staged --worktree .github/workflows/m15-main-truth-sync.yml
          git add -A
          git commit -m "docs(m15): synchronize accepted main truth"

      - name: Push synchronized non-workflow truth
        shell: bash
        run: git push origin HEAD:work/m15-main-truth-sync
