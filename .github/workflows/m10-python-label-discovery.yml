name: M10 Python Label Discovery

on:
  push:
    branches:
      - "work/m10-python-labeled-real-world"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DoctorCode
        uses: actions/checkout@v4
        with:
          path: doctorcode
          persist-credentials: false
      - name: Checkout Flask exact SHA
        uses: actions/checkout@v4
        with:
          repository: pallets/flask
          ref: d73fa1cdcbd8b1465c151db8924ba58b1dd14e35
          path: external/flask
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: doctorcode/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Emit bounded Flask findings for label discovery
        working-directory: doctorcode
        run: go run ./cmd/doctorcode audit ../external/flask --json --max-findings=100
