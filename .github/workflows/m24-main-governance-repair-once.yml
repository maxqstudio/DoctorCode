name: M24 Main Governance Repair Once

on:
  push:
    branches:
      - work/m24-main-governance-repair

permissions:
  contents: write

concurrency:
  group: m24-main-governance-repair-once
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/m24-main-governance-repair
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Checkout exact accepted Skill Workflow authority
        uses: actions/checkout@v4
        with:
          repository: maxqstudio/Skill_Workflow
          ref: 9ac09b2acd0bdf25ea05157be7711da852173ab8
          path: .skill-workflow
          fetch-depth: 1
      - name: Vendor SW2-16 governance runtime
        shell: bash
        run: |
          python .skill-workflow/scripts/migrate_governance_v1.py --root .
          rm -rf .skill-workflow
      - name: Bind SW2-16 authority and M24 squash provenance
        shell: python
        run: |
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, data):
              Path(path).write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          authority = {
              'schema_version': 1,
              'repository': 'maxqstudio/Skill_Workflow',
              'ref': '9ac09b2acd0bdf25ea05157be7711da852173ab8',
              'policy': 'DoctorCode consumes accepted Skill_Workflow SW2-16 from this exact authority. Consumer governance tools are vendored and locked by .workflow/toolchain.lock.json. BEFORE sequence evidence may use exact-tree SQUASH merge provenance only when frozen-plan lineage, accepted branch lineage, exact tree equality, and product-merge ancestry are all proven. Existing DoctorCode acceptance gates remain blocking.'
          }
          save('.workflow/SKILL_AUTHORITY.json', authority)

          session_path = 'docs/sequence/sessions/M24-C-CPP-SEMANTIC-BASELINE.json'
          session = load(session_path)
          assert session['mode'] == 'BEFORE', session
          assert session['scope'] == 'CURRENT', session
          assert session['status'] == 'IN_PROGRESS', session
          assert session['plan']['frozen'] is True, session
          assert session['plan']['frozen_commit'] == 'acdb8c1e2d2e7f9cd6c0cd1263f998d8b74664b5', session
          session['merge_provenance'] = {
              'strategy': 'SQUASH',
              'accepted_branch_head': 'ef32ff08735ddc9b83889d580daa60f303015ca1',
              'product_merge_sha': 'a000c0f4afa7bb88789efc63301a9187ff5bb7dd'
          }
          save(session_path, session)

          state = load('.workflow/state.json')
          assert state['phase'] == 'M24_C_CPP_SEMANTIC_BASELINE', state
          state['status'] = 'M24_MAIN_GOVERNANCE_REPAIR'
          state['working_branch'] = 'work/m24-main-governance-repair'
          state['next_authorized_actions'] = [
              'Require all eight permanent workflows to PASS on one exact SW2-16 governance-repair branch SHA without changing M24 C/C++ product behavior.',
              'Merge the governance-only repair through a guarded squash PR, then require all eight permanent workflows to PASS on the exact repaired main SHA.',
              'Only after repaired exact-main acceptance may M24 be governance-closed and the roadmap advance to M25_CSHARP_DOTNET_SEMANTIC_BASELINE.'
          ]
          proven = [
              'M24 accepted branch head ef32ff08735ddc9b83889d580daa60f303015ca1 passed all eight permanent workflows before merge and has tree eaafc0655680964a74a8d2898e5976205a57185e.',
              'M24 squash product main@a000c0f4afa7bb88789efc63301a9187ff5bb7dd has the exact same tree eaafc0655680964a74a8d2898e5976205a57185e as accepted branch head ef32ff08735ddc9b83889d580daa60f303015ca1.',
              'At M24 product main@a000c0f4afa7bb88789efc63301a9187ff5bb7dd, CI 37247183664, M06 37247183677, Real World Go 37247183735, M07 37247183676, M10 37247183659, M16 37247183663, and M17 37247183637 all passed; Governance 37247183682 failed only because the predecessor SW2-13 BEFORE validator required literal branch ancestry after squash.',
              'Skill_Workflow SW2-16 main@9ac09b2acd0bdf25ea05157be7711da852173ab8 passed its complete permanent main matrix and adds exact-tree squash provenance for BEFORE sessions without weakening frozen-plan lineage requirements.'
          ]
          for item in proven:
              if item not in state.setdefault('proven', []):
                  state['proven'].append(item)
          state['not_proven'] = [
              item for item in state.get('not_proven', [])
              if item != 'M24 is not MAIN_ACCEPTED until one synchronized exact branch SHA passes all eight permanent workflows, squash merge completes, and exact-main revalidation passes.'
          ]
          pending = 'M24 is not MAIN_ACCEPTED until the SW2-16 governance repair passes exact-branch acceptance, merges to main, and the exact repaired main SHA passes all eight permanent workflows.'
          if pending not in state.setdefault('not_proven', []):
              state['not_proven'].append(pending)
          save('.workflow/state.json', state)

          acceptance = load('.workflow/acceptance.json')
          assert acceptance['sequence_session'] == 'M24-C-CPP-SEMANTIC-BASELINE', acceptance
          acceptance['evidence_boundary'] = 'M24 C/C++ product behavior is fixed at squash product main@a000c0f4afa7bb88789efc63301a9187ff5bb7dd. Its seven non-governance permanent workflows passed; Governance run 37247183682 failed only because SW2-13 could not represent BEFORE provenance after squash even though accepted branch ef32ff08735ddc9b83889d580daa60f303015ca1 and product merge a000c0f4afa7bb88789efc63301a9187ff5bb7dd have identical tree eaafc0655680964a74a8d2898e5976205a57185e. This branch upgrades governance only to accepted SW2-16 and records exact-tree SQUASH provenance. M24 remains CURRENT and is not MAIN_ACCEPTED until repaired exact-main 8/8 acceptance passes.'
          ids = {r['id'] for r in acceptance.get('requirements', [])}
          reqs = [
              {
                  'id': 'M24-SQUASH-TREE-PROVENANCE',
                  'requirement': 'The accepted M24 branch tree must be cryptographically identical to the squash product merge tree, with frozen-plan lineage retained through the accepted branch head.',
                  'status': 'PASS',
                  'evidence': 'accepted branch ef32ff08735ddc9b83889d580daa60f303015ca1 tree eaafc0655680964a74a8d2898e5976205a57185e; product merge a000c0f4afa7bb88789efc63301a9187ff5bb7dd tree eaafc0655680964a74a8d2898e5976205a57185e; SW2-16 exact-tree SQUASH provenance validator applies.'
              },
              {
                  'id': 'M24-PRODUCT-MAIN-NON-GOVERNANCE',
                  'requirement': 'The exact M24 squash product merge must preserve all product and regression lanes while governance provenance is repaired separately.',
                  'status': 'PASS',
                  'evidence': 'At a000c0f4afa7bb88789efc63301a9187ff5bb7dd: CI 37247183664 PASS; M06 37247183677 PASS; Real World Go 37247183735 PASS; M07 37247183676 PASS; M10 37247183659 PASS; M16 37247183663 PASS; M17 37247183637 PASS. Governance 37247183682 is retained as the predecessor-validator failure, not relabeled PASS.'
              }
          ]
          for req in reqs:
              if req['id'] not in ids:
                  acceptance.setdefault('requirements', []).append(req)
          save('.workflow/acceptance.json', acceptance)
      - name: Remove one-shot workflow from final tree
        run: rm .github/workflows/m24-main-governance-repair-once.yml
      - name: Synchronize Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .
      - name: Validate dirty generated outputs before commit
        shell: bash
        run: |
          python .workflow/tools/validate_schema_toolchain.py --root .
          python .workflow/tools/validate_repository_health.py --root . --require-owner-approved-license
          python .workflow/tools/validate_project_docs.py --root .
          python .workflow/tools/validate_doc_quality.py --root .
          python .workflow/tools/validate_human_comprehension.py --root . --require-pass
          python .workflow/tools/validate_handoff.py --root .
      - name: Commit governance repair locally
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(m24): repair squash provenance with SW2-16'
      - name: Validate clean committed governance repair
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          python .workflow/tools/validate_schema_toolchain.py --root .
          python .workflow/tools/validate_repository_health.py --root . --require-owner-approved-license
          python .workflow/tools/validate_sequence_contract.py --root . --session docs/sequence/sessions/M24-C-CPP-SEMANTIC-BASELINE.json --no-write-report
          python .workflow/tools/validate_sequence_human_view.py --root . --session docs/sequence/sessions/M24-C-CPP-SEMANTIC-BASELINE.json
          python .workflow/tools/validate_sequence_sessions.py --root .
          python .workflow/tools/validate_cross_document_consistency.py --root . --base 1f9686f2f8f560cd3637cd33c91162420e09dc39 --require-base
          python .workflow/tools/validate_project_truth.py --root .
      - name: Push validated governance repair
        run: git push origin HEAD:work/m24-main-governance-repair
