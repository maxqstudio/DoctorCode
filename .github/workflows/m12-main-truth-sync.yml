name: M12 Main Truth Sync

on:
  push:
    branches:
      - "work/m12-main-truth-sync"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/m12-main-truth-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Record accepted M12 main truth
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, data):
              Path(path).write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          state = load(".workflow/state.json")
          state["status"] = "M12_MAIN_ACCEPTED"
          state["working_branch"] = "main"
          state["last_accepted_sha"] = "368c7b05d08d95beb5164d437920bbdd83c39e32"
          state["last_accepted_branch"] = "main"
          for item in [
              "M12 Go Related Context merged through PR #9 to main at 368c7b05d08d95beb5164d437920bbdd83c39e32.",
              "Exact M12 product main Governance Bootstrap run 36323970886 completed success.",
              "Exact M12 product main Core CI run 36323970841 completed success on ubuntu-latest, windows-latest, and macos-latest.",
              "Exact M12 product main M10 Labeled Real World Python run 36323970832 completed success on all three operating systems.",
              "Exact M12 product main M07 Python Real World run 36323970756 completed success on all three operating systems.",
              "Exact M12 product main M06 Labeled Real World Go run 36323970803 completed success on all three operating systems.",
              "Exact M12 product main Real World Go Validation run 36323970845 completed success on all three operating systems."
          ]:
              if item not in state["proven"]:
                  state["proven"].append(item)
          state["next_authorized_actions"] = [
              "Proceed to M13 Python Related Context parity under the Owner directive to continue until the DoctorCode product is complete.",
              "Branch M13 only from the governance-normalized M12 main after exact closure acceptance.",
              "Preserve M12 product acceptance at 368c7b05d08d95beb5164d437920bbdd83c39e32 and exact post-merge evidence as immutable historical evidence."
          ]
          state["blocked_actions"] = [
              "Claiming cross-language related-context parity before M13 acceptance.",
              "Treating related context as a complete dependency graph or safe-delete proof.",
              "Starting MCP/Skill adapters before context parity and deterministic verification are accepted."
          ]
          save(".workflow/state.json", state)

          acceptance = load(".workflow/acceptance.json")
          if not any(x.get("id") == "M12-MAIN-POST-MERGE" for x in acceptance["requirements"]):
              acceptance["requirements"].append({
                  "id": "M12-MAIN-POST-MERGE",
                  "requirement": "The exact M12 product main merge SHA must pass strict governance and every accepted cross-platform regression lane before becoming the next development base.",
                  "evidence": "main@368c7b05d08d95beb5164d437920bbdd83c39e32: Governance Bootstrap 36323970886, Core CI 36323970841, M10 Labeled Real World Python 36323970832, M07 Python Real World 36323970756, M06 Labeled Real World Go 36323970803, and Real World Go Validation 36323970845 all completed success; every matrix job passed on Linux, Windows, and macOS.",
                  "status": "PASS"
              })
          acceptance["evidence_boundary"] = "M12 Go Related Context is product-main accepted at 368c7b05d08d95beb5164d437920bbdd83c39e32 after strict governance and every accepted Linux, Windows, and macOS regression lane passed. M12 enriches eligible top-level non-method Go findings with bounded same-package production/test references only. Python parity, methods, external test packages, transitive dependency graphs, safe deletion, and automatic repair remain outside M12 authority."
          acceptance["truth_gates"]["CROSS_DOCUMENT_CONSISTENCY"] = "PASS"
          acceptance["truth_gates"]["PROJECT_STATE_SYNC"] = "PASS"
          acceptance["truth_gates"]["SEQUENCE_SYNC"] = "PASS"
          acceptance["sequence_sync_status"] = "PASS"
          save(".workflow/acceptance.json", acceptance)

          claims = load(".workflow/claims.json")
          if not any(x.get("id") == "TRUTH-M12-MAIN-ACCEPTED" for x in claims["claims"]):
              claims["claims"].append({
                  "id": "TRUTH-M12-MAIN-ACCEPTED",
                  "claim": "M12 Go Related Context is merged and post-merge accepted on main at 368c7b05d08d95beb5164d437920bbdd83c39e32 after strict governance and every accepted Linux, Windows, and macOS regression lane completed successfully.",
                  "documents": ["PROJECT_TRUTH_SYNC.md"],
                  "source_owners": [".workflow/state.json", ".workflow/acceptance.json"],
                  "tests": [
                      ".github/workflows/governance-bootstrap.yml",
                      ".github/workflows/ci.yml",
                      ".github/workflows/m10-python-labeled-real-world.yml",
                      ".github/workflows/m07-python-real-world.yml",
                      ".github/workflows/m06-labeled-real-world.yml",
                      ".github/workflows/real-world-go.yml"
                  ],
                  "runtime_evidence": [
                      "GitHub Actions Governance Bootstrap run 36323970886 at 368c7b05d08d95beb5164d437920bbdd83c39e32",
                      "GitHub Actions Core CI run 36323970841 at 368c7b05d08d95beb5164d437920bbdd83c39e32",
                      "GitHub Actions M10 Labeled Real World Python run 36323970832 at 368c7b05d08d95beb5164d437920bbdd83c39e32",
                      "GitHub Actions M07 Python Real World run 36323970756 at 368c7b05d08d95beb5164d437920bbdd83c39e32",
                      "GitHub Actions M06 Labeled Real World Go run 36323970803 at 368c7b05d08d95beb5164d437920bbdd83c39e32",
                      "GitHub Actions Real World Go Validation run 36323970845 at 368c7b05d08d95beb5164d437920bbdd83c39e32"
                  ],
                  "status": "PASS"
              })
          save(".workflow/claims.json", claims)

          changelog = load(".workflow/changelog.json")
          if not any(x.get("title") == "M12 main accepted baseline" for x in changelog["entries"]):
              changelog["entries"].insert(0, {
                  "date": "2026-09-27",
                  "title": "M12 main accepted baseline",
                  "type": "acceptance",
                  "changes": [
                      "Merged FINAL_ACCEPTED M12 through PR #9 to main at 368c7b05d08d95beb5164d437920bbdd83c39e32.",
                      "Passed strict Governance Bootstrap on the exact product main merge SHA.",
                      "Passed Core CI, bounded Python labels, pinned Python public-source validation, bounded Go labels, and pinned Go public-source validation on Linux, Windows, and macOS.",
                      "Authorized the next product phase for Python related-context parity under the Owner directive to continue until DoctorCode is complete."
                  ]
              })
          save(".workflow/changelog.json", changelog)

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = re.sub(
              r"\*\*M12 Go Related Context is accepted on the development branch pending final exact-SHA promotion checks\.\*\*",
              "**M12 Go Related Context is accepted on main at 368c7b05d08d95beb5164d437920bbdd83c39e32.**",
              readme,
              count=1,
          )
          readme_path.write_text(readme, encoding="utf-8")

      - name: Remove temporary workflow from final tree
        run: git rm .github/workflows/m12-main-truth-sync.yml

      - name: Regenerate M12 sequence actual
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --root .
          --output-json docs/sequence/generated/M12-GO-RELATED-CONTEXT.actual.json
          --output-mermaid docs/sequence/generated/M12-GO-RELATED-CONTEXT.actual.mmd

      - name: Synchronize generated Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .

      - name: Validate generated artifacts before commit
        run: |
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass

      - name: Commit synchronized M12 main truth
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m12): synchronize accepted main truth"
          git push origin HEAD:work/m12-main-truth-sync
