name: M19 Rebased Truth Sync

on:
  push:
    branches:
      - work/m19-mutation-hardening

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Synchronize rebased M19 truth
        run: |
          python .workflow/tools/sync_project_truth.py
          python .workflow/tools/generate_sequence_actual.py --output-json docs/sequence/generated/M19-JAVASCRIPT-TYPESCRIPT-LOGIC.actual.json --output-mermaid docs/sequence/generated/M19-JAVASCRIPT-TYPESCRIPT-LOGIC.actual.mmd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git add .workflow/generated/code_facts.json .workflow/acceptance.json docs
            git commit -m "docs(m19): synchronize rebased project truth"
            git push
          fi
