name: M17 Project Truth Sync

on:
  push:
    branches:
      - "work/m17-release-install-hardening"

concurrency:
  group: m17-project-truth-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/m17-release-install-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build intended final tree
        shell: bash
        run: |
          git rm .github/workflows/m17-project-truth-sync.yml
          python .workflow/tools/generate_sequence_actual.py             --root .             --output-json docs/sequence/generated/M17-RELEASE-INSTALL-HARDENING.actual.json             --output-mermaid docs/sequence/generated/M17-RELEASE-INSTALL-HARDENING.actual.mmd
          python .workflow/tools/validate_sequence_contract.py             --root .             --session docs/sequence/sessions/M17-RELEASE-INSTALL-HARDENING.json
          python .workflow/tools/sync_project_truth.py --root .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m17): validate synchronized release project truth"

      - name: Validate clean intended final tree
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_cross_document_consistency.py             --base 48b6d930b5231a9f808e74a7c58ebbd76174fabd             --require-base
          python .workflow/tools/validate_project_truth.py

      - name: Prepare connector-safe commit
        shell: bash
        run: |
          git reset --soft "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --staged --worktree .github/workflows/m17-project-truth-sync.yml
          git add -A
          git commit -m "docs(m17): synchronize release project truth"
          git push origin HEAD:work/m17-release-install-hardening
