name: M23 Final Truth Sync

on:
  push:
    branches:
      - work/m23-java-kotlin-semantic-baseline

permissions:
  contents: write

concurrency:
  group: m23-final-truth-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Synchronize M23 governed truth
        run: |
          python .workflow/tools/sync_project_truth.py
          python .workflow/tools/generate_sequence_actual.py --output-json docs/sequence/generated/M23-JAVA-KOTLIN-SEMANTIC-BASELINE.actual.json --output-mermaid docs/sequence/generated/M23-JAVA-KOTLIN-SEMANTIC-BASELINE.actual.mmd
          python - <<'PY'
          import json
          from pathlib import Path
          session_path = Path("docs/sequence/sessions/M23-JAVA-KOTLIN-SEMANTIC-BASELINE.json")
          actual_path = Path("docs/sequence/generated/M23-JAVA-KOTLIN-SEMANTIC-BASELINE.actual.json")
          session = json.loads(session_path.read_text(encoding="utf-8"))
          actual = json.loads(actual_path.read_text(encoding="utf-8"))
          session["actual"]["source_digest"] = actual["source_digest"]
          session["actual"]["entries"] = actual.get("entries", [])
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n")
          PY
          python .workflow/tools/sync_project_truth.py
          python .workflow/tools/generate_sequence_actual.py --output-json docs/sequence/generated/M23-JAVA-KOTLIN-SEMANTIC-BASELINE.actual.json --output-mermaid docs/sequence/generated/M23-JAVA-KOTLIN-SEMANTIC-BASELINE.actual.mmd
      - name: Commit synchronized generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git add .workflow/generated/code_facts.json .workflow/acceptance.json docs
            git commit -m "docs(m23): synchronize JVM semantic truth"
            git push
          fi
