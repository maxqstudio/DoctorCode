name: M25 Governance Sync Scratch

on:
  push:
    branches:
      - work/m25-governance-sync-scratch

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update M25 pre-merge authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, data):
              Path(path).write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          def append_unique(items, value):
              if value not in items:
                  items.append(value)

          state = load('.workflow/state.json')
          state['status'] = 'M25_IMPLEMENTED_VALIDATION_PENDING'
          state['next_authorized_actions'] = [
              'Synchronize M25 Project Truth and BEFORE sequence actual evidence without widening C#/.NET semantic authority.',
              'Require all eight permanent workflows to PASS on one exact synchronized M25 branch SHA, including Core C# benchmark on Ubuntu/Windows/macOS and release/install regression.',
              'Only after exact branch acceptance may M25 be proposed for squash merge and exact-main revalidation.'
          ]
          for item in [
              'M25 RED candidate 0a1dc833e8ae61993b63830768f2ac77d01c3c33 ran Core CI 37293193349 and failed on Ubuntu, Windows, and macOS exactly at the M25 C# benchmark gate because benchmark analyzer "csharp" was absent; the seven non-Core permanent workflows remained successful.',
              'M25 uses pinned gotreesitter v0.55.1 standalone C# grammar with embedded strict parsing; parser health requires a non-nil tree/root and rejects parser errors plus ERROR/MISSING nodes, while malformed C# fails closed.',
              'M25 bounded analyzer csharp/gotreesitter-v1 exposes only CSHARP-SEC-HARDCODED-CREDENTIAL, CSHARP-SIMPLIFY-BOOL-RETURN, and CSHARP-LOGIC-DUPLICATE-CONDITION with safe_autofix=false; DEADCODE and BLOAT remain unavailable.',
              'M25 project/solution awareness is limited to deterministic presence-only inventory of visible .csproj/.sln manifests; malformed project manifests are not evaluated, unrelated source is not assigned project membership, and MSBuild/NuGet/TFM/project-graph semantics remain NOT_PROVEN.',
              'M25 product candidate e60e4c0d5445d05399462f80aac0f0fa12a3a163 passed Core CI 37378314705 on Ubuntu, Windows, and macOS. The 12-case C# corpus reports 4 TP / 0 FP / 0 FN, precision=1.0, recall=1.0; all three declared M25 rules report precision=1.0 and recall=1.0.',
              'At M25 product candidate e60e4c0d5445d05399462f80aac0f0fa12a3a163, M06 37378314683, Real World Go 37378314565, M07 37378314754, M10 37378314740, M16 Thin MCP 37378314715, and M17 Release and Install 37378314687 completed success; Governance 37378314768 failed only because generated Project Truth had not yet been synchronized to the changed source facts.'
          ]:
              append_unique(state.setdefault('proven', []), item)
          append_unique(state.setdefault('not_proven', []), 'M25 .csproj/.sln presence evidence does not prove solution membership, project-reference graphs, target-framework selection, package resolution, MSBuild condition evaluation, or generated-source execution.')
          save('.workflow/state.json', state)

          acceptance = load('.workflow/acceptance.json')
          acceptance['evidence_boundary'] = (
              'M24 remains the last MAIN_ACCEPTED product authority. M25 BEFORE plan was frozen at '
              'ab5c6e3b58369b3675eb3d5291f751a0657641d5 before C# implementation. M25 RED is proven at '
              '0a1dc833e8ae61993b63830768f2ac77d01c3c33 / Core 37293193349. Current product candidate '
              'e60e4c0d5445d05399462f80aac0f0fa12a3a163 uses gotreesitter v0.55.1 strict C# syntax authority, '
              'three bounded rules, and presence-only .csproj/.sln representation; Core 37378314705 reports '
              '12 cases = 4 TP / 0 FP / 0 FN on Ubuntu/Windows/macOS. DEADCODE/BLOAT, MSBuild/NuGet/Roslyn, '
              'source-generator/reflection/whole-program semantics, safe autofix, and automatic deletion remain '
              'outside authority. M25 is not MAIN_ACCEPTED until one synchronized exact branch SHA passes all '
              'eight permanent workflows, squash merge completes, and exact-main revalidation passes.'
          )
          new_requirements = [
              {
                  'id': 'M25-RED-ANALYZER-ABSENT',
                  'requirement': 'The governed 12-case C# benchmark must prove C# analyzer authority absent before implementation.',
                  'evidence': 'Core CI 37293193349 at 0a1dc833e8ae61993b63830768f2ac77d01c3c33 failed on Ubuntu, Windows, and macOS exactly at the M25 C# gate with unknown benchmark analyzer "csharp"; all seven non-Core permanent workflows passed.',
                  'status': 'PASS'
              },
              {
                  'id': 'M25-STRICT-PARSER',
                  'requirement': 'Recognized C# source must use the pinned strict AST parser and fail closed on malformed syntax, ERROR nodes, or MISSING nodes.',
                  'evidence': 'internal/analyzers/csharp/syntax.go uses gotreesitter v0.55.1 C# with strict parser health; internal/analyzers/csharp parser tests and the C# package test suite pass in Core 37378314705 on Ubuntu, Windows, and macOS.',
                  'status': 'PASS'
              },
              {
                  'id': 'M25-BOUNDED-RULES',
                  'requirement': 'M25 must expose only the declared bounded SECURITY, SIMPLIFY, and LOGIC rules without DEADCODE/BLOAT or safe autofix authority.',
                  'evidence': 'csharp/gotreesitter-v1 descriptor declares exactly CSHARP-SEC-HARDCODED-CREDENTIAL, CSHARP-SIMPLIFY-BOOL-RETURN, and CSHARP-LOGIC-DUPLICATE-CONDITION with safe_autofix=false; unsupported semantic boundaries remain explicit.',
                  'status': 'PASS'
              },
              {
                  'id': 'M25-PROJECT-SCOPE-BOUNDARY',
                  'requirement': 'Project/solution scope must be represented conservatively without inferring unproven MSBuild or solution semantics.',
                  'evidence': 'internal/analyzers/csharp/project.go inventories visible .csproj/.sln manifests as presence_only evidence; project_test.go proves malformed manifests are not evaluated and unrelated source is not assigned project membership. Core 37378314705 passes the tests on all three OS lanes.',
                  'status': 'PASS'
              },
              {
                  'id': 'M25-CORPUS-GREEN',
                  'requirement': 'The complete 12-case M25 C# corpus must pass with zero false positives and zero false negatives on Ubuntu, Windows, and macOS.',
                  'evidence': 'Core CI 37378314705 at e60e4c0d5445d05399462f80aac0f0fa12a3a163 passed all three OS jobs. M25 reports 12 cases = 4 TP / 0 FP / 0 FN, precision=1.0, recall=1.0; SECURITY=1 TP, LOGIC=1 TP, SIMPLIFY=2 TP.',
                  'status': 'PASS'
              }
          ]
          reqs = acceptance.setdefault('requirements', [])
          by_id = {item.get('id'): idx for idx, item in enumerate(reqs)}
          for req in new_requirements:
              if req['id'] in by_id:
                  reqs[by_id[req['id']]] = req
              else:
                  reqs.append(req)
          append_unique(acceptance.setdefault('runtime_checks', []), 'M25 C#/.NET labeled, adversarial, repository-shaped benchmark gate on Core CI Ubuntu/Windows/macOS')
          append_unique(acceptance.setdefault('test_commands', []), 'go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m25-csharp.json --analyzer=csharp --json')
          save('.workflow/acceptance.json', acceptance)

          session_path = 'docs/sequence/sessions/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.json'
          session = load(session_path)
          session['acceptance_report'] = 'artifacts/sequence/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.acceptance.json'
          session['evidence_boundary'] = (
              'M25 BEFORE plan was frozen at ab5c6e3b58369b3675eb3d5291f751a0657641d5 before C# product implementation. '
              'DOCUMENT edges remain design traceability only because generic sequence extraction does not resolve Go call graphs or .NET build semantics. '
              'RED: 0a1dc833e8ae61993b63830768f2ac77d01c3c33 / Core 37293193349. Product GREEN before Project Truth sync: '
              'e60e4c0d5445d05399462f80aac0f0fa12a3a163 / Core 37378314705, 12 cases = 4 TP / 0 FP / 0 FN on Ubuntu/Windows/macOS. '
              '.csproj/.sln evidence is manifest-presence only; MSBuild/NuGet/Roslyn/source-generator/reflection/whole-program semantics remain NOT_PROVEN. '
              'Historical M19-M24 sequence evidence remains content-addressed and immutable under SW2-16 Historical Evidence Freeze.'
          )
          append_unique(session.setdefault('tests', []), 'internal/analyzers/csharp/project_test.go')
          save(session_path, session)
          PY
      - name: Remove scratch workflow from generated tree
        run: rm .github/workflows/m25-governance-sync-scratch.yml
      - name: Generate M25 actual sequence
        run: |
          python .workflow/tools/generate_sequence_actual.py \
            --root . \
            --output-json docs/sequence/generated/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.actual.json \
            --output-mermaid docs/sequence/generated/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.actual.mmd
          python - <<'PY'
          import json
          from pathlib import Path
          graph = json.loads(Path('docs/sequence/generated/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.actual.json').read_text(encoding='utf-8'))
          path = Path('docs/sequence/sessions/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.json')
          session = json.loads(path.read_text(encoding='utf-8'))
          session['actual']['source_digest'] = graph['source_digest']
          path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Validate M25 sequence and emit acceptance report
        run: |
          python .workflow/tools/validate_sequence_contract.py \
            --root . \
            --session docs/sequence/sessions/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.json
      - name: Generate Project Truth
        run: python .workflow/tools/generate_project_docs.py --root .
      - name: Validate governed outputs
        run: |
          python .workflow/tools/validate_schema_toolchain.py --root .
          python .workflow/tools/validate_repository_health.py --root . --require-owner-approved-license
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_cross_document_consistency.py --base cd05f064e1bb1054271e7028941c1fbb80ea32aa --require-base
          python .workflow/tools/validate_project_truth.py
          python .workflow/tools/validate_sequence_sessions.py
      - name: Commit clean governed tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git commit -m "chore(m25): synchronize governed Project Truth"
          git push origin HEAD:work/m25-governance-sync-scratch
