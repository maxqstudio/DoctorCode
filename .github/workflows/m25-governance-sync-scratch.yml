name: M25 Governance Sync Scratch

on:
  push:
    branches:
      - scratch/m25-governance-sync-final

permissions:
  contents: write

concurrency:
  group: m25-governance-sync-scratch
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify scratch lineage
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "e60e4c0d5445d05399462f80aac0f0fa12a3a163"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/m25-governance-sync-scratch.yml"
      - name: Record M25 product validation authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def write(path, data):
              Path(path).write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n")

          state_path = ".workflow/state.json"
          state = load(state_path)
          if state.get("status") != "M25_PLANNED_RED_PENDING":
              raise SystemExit(f"unexpected state status: {state.get('status')}")
          state["status"] = "M25_IMPLEMENTED_VALIDATION_PENDING"
          state["next_authorized_actions"] = [
              "Synchronize M25 Project Truth and BEFORE sequence actual evidence without widening C#/.NET semantic authority.",
              "Require all eight permanent workflows to PASS on one exact synchronized M25 branch SHA, including the Core C# benchmark on Ubuntu/Windows/macOS and release/install regression.",
              "Only after exact branch acceptance may M25 be proposed for squash merge and exact-main revalidation."
          ]
          new_proven = [
              "M25 RED candidate 0a1dc833e8ae61993b63830768f2ac77d01c3c33 ran Core CI 37293193349 and failed on Ubuntu, Windows, and macOS at the M25 C#/.NET semantic benchmark gate before C# analyzer authority existed; earlier accepted Core gates passed.",
              "M25 product candidate e60e4c0d5445d05399462f80aac0f0fa12a3a163 passed Core CI 37378314705 on Ubuntu, Windows, and macOS. The 12-case C# corpus is hard-asserted at 4 TP / 0 FP / 0 FN, precision=1.0, recall=1.0.",
              "M25 represents .csproj/.sln scope conservatively through deterministic manifest-presence inventory only; project manifests are not parsed or evaluated, generated/build directories are excluded, and MSBuild/NuGet/project-reference/solution-membership/source-generator semantics remain NOT_PROVEN.",
              "At exact product candidate e60e4c0d5445d05399462f80aac0f0fa12a3a163, the seven non-governance permanent workflows passed: CI 37378314705, M06 37378314683, Real World Go 37378314565, M07 37378314754, M10 37378314740, M16 Thin MCP 37378314715, and M17 Release and Install 37378314687. Governance 37378314768 remains the expected pre-sync Project Truth failure and is not relabeled PASS."
          ]
          for item in new_proven:
              if item not in state.setdefault("proven", []):
                  state["proven"].append(item)
          main_pending = "M25 is not MAIN_ACCEPTED until one synchronized exact branch SHA passes all eight permanent workflows, squash merge completes, and exact-main revalidation passes."
          if main_pending not in state.setdefault("not_proven", []):
              state["not_proven"].append(main_pending)
          write(state_path, state)

          acceptance_path = ".workflow/acceptance.json"
          acceptance = load(acceptance_path)
          acceptance["evidence_boundary"] = (
              "M24 is MAIN_ACCEPTED and governance-closed. M25 BEFORE plan remains frozen at "
              "ab5c6e3b58369b3675eb3d5291f751a0657641d5. M25 product behavior is green at "
              "e60e4c0d5445d05399462f80aac0f0fa12a3a163 / Core CI 37378314705, but M25 is not "
              "branch-accepted or MAIN_ACCEPTED until synchronized Project Truth and all eight permanent workflows PASS "
              "on one exact branch SHA followed by squash merge and exact-main revalidation. Authority is limited to "
              "pure-Go gotreesitter C# syntax/AST, direct-literal SECURITY, opposite-boolean SIMPLIFY, duplicate unmodified-bool-parameter LOGIC, "
              "generated-code exclusion, and .csproj/.sln manifest-presence evidence. DEADCODE/BLOAT, MSBuild/NuGet/Roslyn/source-generator/reflection/whole-program semantics, safe autofix, and automatic deletion remain outside authority."
          )
          requirements = acceptance.setdefault("requirements", [])
          by_id = {item.get("id"): item for item in requirements}
          additions = [
              {
                  "id": "M25-RED-CSHARP-ABSENT",
                  "requirement": "The C# benchmark must prove C# analyzer authority absent before implementation on all Core CI operating systems.",
                  "evidence": "Core CI run 37293193349 at 0a1dc833e8ae61993b63830768f2ac77d01c3c33 failed on Ubuntu, Windows, and macOS at the M25 C#/.NET semantic benchmark gate before the C# analyzer was registered; earlier accepted Core gates passed.",
                  "status": "PASS"
              },
              {
                  "id": "M25-PARSER-AUTHORITY",
                  "requirement": "Visible .cs source must use deterministic embedded parsing and malformed syntax must fail closed without requiring a .NET runtime.",
                  "evidence": "csharp/gotreesitter-v1 reuses pinned gotreesitter v0.55.1 grammars/c_sharp through ParseWithStrict; internal/analyzers/csharp/analyzer_test.go requires malformed C# source to fail closed.",
                  "status": "PASS"
              },
              {
                  "id": "M25-BOUNDED-RULES",
                  "requirement": "M25 must expose only bounded SECURITY, SIMPLIFY, and LOGIC rules with safe_autofix=false; C# DEADCODE and BLOAT must remain unavailable.",
                  "evidence": "csharp/gotreesitter-v1 declares exactly CSHARP-SEC-HARDCODED-CREDENTIAL, CSHARP-SIMPLIFY-BOOL-RETURN, and CSHARP-LOGIC-DUPLICATE-CONDITION with safe_autofix=false. No C# DEADCODE or BLOAT rule is registered.",
                  "status": "PASS"
              },
              {
                  "id": "M25-PROJECT-SOLUTION-BOUNDARY",
                  "requirement": "M25 must represent .csproj/.sln and generated-code boundaries conservatively without claiming MSBuild, dependency-graph, solution-membership, or source-generator semantics.",
                  "evidence": "internal/analyzers/csharp/project.go::discoverProjectScope inventories visible .csproj/.sln paths deterministically, skips symlinks and ignored generated/build directories, and adds manifest-presence-only evidence. project_test.go proves malformed project XML is not parsed and unrelated source is not assigned project membership.",
                  "status": "PASS"
              },
              {
                  "id": "M25-ADVERSARIAL-GREEN",
                  "requirement": "The labeled/adversarial/repository-shaped C# corpus must pass with zero false positives and zero false negatives on Core CI Ubuntu, Windows, and macOS.",
                  "evidence": "Core CI run 37378314705 at e60e4c0d5445d05399462f80aac0f0fa12a3a163 passed all three OS jobs. TestM25Corpus hard-asserts 12 cases = 4 TP / 0 FP / 0 FN; the corpus includes project-shaped, generated-source, preprocessor, partial-type, async/nullable, mutation, nested-local-function, placeholder-secret, and interpolated-secret boundaries.",
                  "status": "PASS"
              },
              {
                  "id": "M25-REGRESSION-MATRIX",
                  "requirement": "One exact synchronized M25 branch candidate must pass governance, Core, MCP, release/install, and all accepted Go/Python real-world regression lanes before PR promotion.",
                  "evidence": "At e60e4c0d5445d05399462f80aac0f0fa12a3a163 all seven non-governance permanent workflows passed, while Governance 37378314768 correctly failed on stale Project Truth before synchronization. Final synchronized 8/8 branch acceptance has not yet run.",
                  "status": "NOT_RUN"
              }
          ]
          for item in additions:
              existing = by_id.get(item["id"])
              if existing is None:
                  requirements.append(item)
                  by_id[item["id"]] = item
              elif existing != item:
                  raise SystemExit(f"conflicting existing requirement: {item['id']}")

          runtime_check = "M25 C#/.NET 12-case parser-backed labeled/adversarial/repository-shaped benchmark gate on Core CI Ubuntu/Windows/macOS"
          if runtime_check not in acceptance.setdefault("runtime_checks", []):
              acceptance["runtime_checks"].append(runtime_check)
          for command in [
              "go test ./internal/analyzers/csharp ./internal/analyzers ./internal/engine ./internal/benchmark",
              "go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m25-csharp.json --analyzer=csharp --json"
          ]:
              if command not in acceptance.setdefault("test_commands", []):
                  acceptance["test_commands"].append(command)
          write(acceptance_path, acceptance)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow/state.json .workflow/acceptance.json
          git diff --cached --quiet && { echo "authority mutation produced no diff"; exit 1; }
          git commit -m "chore(m25): record product validation authority"
      - name: Generate sequence evidence and Project Truth
        shell: bash
        run: |
          SESSION="docs/sequence/sessions/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.json"
          ACTUAL_JSON="docs/sequence/generated/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.actual.json"
          ACTUAL_MMD="docs/sequence/generated/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.actual.mmd"
          python .workflow/tools/generate_sequence_actual.py --root . --output-json "$ACTUAL_JSON" --output-mermaid "$ACTUAL_MMD"
          python - <<'PY'
          import json
          from pathlib import Path

          session_path = Path("docs/sequence/sessions/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.json")
          actual_path = Path("docs/sequence/generated/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.actual.json")
          session = json.loads(session_path.read_text(encoding="utf-8"))
          actual = json.loads(actual_path.read_text(encoding="utf-8"))
          if session.get("scope") != "CURRENT" or session.get("status") != "IN_PROGRESS":
              raise SystemExit("M25 session must remain CURRENT / IN_PROGRESS before merge")
          session["acceptance_report"] = "artifacts/sequence/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.acceptance.json"
          session.setdefault("actual", {})["source_digest"] = actual["source_digest"]
          session["evidence_boundary"] = (
              "M25 BEFORE plan was frozen at ab5c6e3b58369b3675eb3d5291f751a0657641d5 before C# product implementation. "
              "DOCUMENT edges are design traceability only because generic extraction does not resolve Go call graphs or .NET build semantics. "
              "Behavioral authority is RED 0a1dc833e8ae61993b63830768f2ac77d01c3c33 / Core 37293193349 and GREEN product candidate "
              "e60e4c0d5445d05399462f80aac0f0fa12a3a163 / Core 37378314705, whose 12-case corpus is hard-asserted at 4 TP / 0 FP / 0 FN on Ubuntu/Windows/macOS. "
              ".csproj/.sln handling is deterministic manifest-presence evidence only; MSBuild/NuGet/project-reference/solution-membership/Roslyn/source-generator/reflection/whole-program semantics remain NOT_PROVEN. "
              "Historical M19-M24 sequence evidence remains content-addressed and immutable under SW2-16 Historical Evidence Freeze."
          )
          tests = session.setdefault("tests", [])
          for path in ["internal/benchmark/testdata/m25-csharp.json", "internal/analyzers/csharp/analyzer_test.go", "internal/analyzers/csharp/project_test.go"]:
              if path not in tests:
                  tests.append(path)
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n")
          PY
          python .workflow/tools/validate_sequence_contract.py --root . --session "$SESSION"
          python .workflow/tools/sync_project_truth.py --root .
          git add -A
          git diff --cached --quiet && { echo "generated synchronization produced no diff"; exit 1; }
          git commit -m "docs(m25): synchronize governed project truth"
      - name: Validate synchronized governance
        shell: bash
        run: |
          python .workflow/tools/validate_schema_toolchain.py --root .
          python .workflow/tools/validate_repository_health.py --root . --require-owner-approved-license
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_cross_document_consistency.py --base cd05f064e1bb1054271e7028941c1fbb80ea32aa --require-base
          python .workflow/tools/validate_project_truth.py
          python .workflow/tools/validate_sequence_sessions.py
          test -z "$(git status --porcelain)"
      - name: Fast-forward governed result to working branch
        shell: bash
        run: git push origin HEAD:refs/heads/work/m25-csharp-dotnet-semantic-baseline
