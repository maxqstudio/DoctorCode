name: M12 Finalize Accepted State

on:
  push:
    branches:
      - "work/m12-go-related-context"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/m12-go-related-context
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Record M12 accepted branch evidence
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, data):
              Path(path).write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          state = load(".workflow/state.json")
          state["status"] = "M12_ACCEPTED"
          for item in [
              "Final synchronized M12 branch tree edc415a2935307490cf73ec12fed72ff9a0c042b passed Governance Bootstrap run 36323629497.",
              "Core CI run 36323629517 at edc415a2935307490cf73ec12fed72ff9a0c042b passed on ubuntu-latest, windows-latest, and macos-latest.",
              "M10 Python labels run 36323629491, M07 Python Real World run 36323629637, M06 Go labels run 36323629567, and Real World Go run 36323629559 all passed on Linux, Windows, and macOS at edc415a2935307490cf73ec12fed72ff9a0c042b."
          ]:
              if item not in state["proven"]:
                  state["proven"].append(item)
          state["next_authorized_actions"] = [
              "Run final exact-SHA acceptance on the finalized M12 branch tree with no temporary workflow present.",
              "Open and merge the FINAL_ACCEPTED M12 pull request to main.",
              "Rerun Governance Bootstrap, Core CI, and every accepted real-world lane on the exact main merge SHA before starting the next product phase."
          ]
          save(".workflow/state.json", state)

          acceptance = load(".workflow/acceptance.json")
          for row in acceptance["requirements"]:
              if row["id"] == "M12-STRICT-GOVERNANCE-FINAL":
                  row["status"] = "PASS"
                  row["evidence"] = "Governance Bootstrap run 36323629497 at edc415a2935307490cf73ec12fed72ff9a0c042b completed success after generated M12 Project Truth and sequence synchronization; finalization is governance-only and will be revalidated on its exact SHA."
          acceptance["truth_gates"]["CROSS_DOCUMENT_CONSISTENCY"] = "PASS"
          acceptance["truth_gates"]["PROJECT_STATE_SYNC"] = "PASS"
          acceptance["truth_gates"]["SEQUENCE_SYNC"] = "PASS"
          acceptance["sequence_sync_status"] = "PASS"
          save(".workflow/acceptance.json", acceptance)

          session = load("docs/sequence/sessions/M12-GO-RELATED-CONTEXT.json")
          session["status"] = "ACCEPTED"
          save("docs/sequence/sessions/M12-GO-RELATED-CONTEXT.json", session)

          changelog = load(".workflow/changelog.json")
          if not any(x.get("title") == "M12 Go Related Context accepted baseline" for x in changelog["entries"]):
              changelog["entries"].insert(0, {
                  "date": "2026-09-27",
                  "title": "M12 Go Related Context accepted baseline",
                  "type": "acceptance",
                  "changes": [
                      "Accepted binding-aware Go related production/test reference context for eligible findings.",
                      "Accepted packet schema v2 with bounded related excerpts and related_total/truncation signaling.",
                      "Accepted early repository-boundary rejection before related discovery reads outside source.",
                      "Accepted three-OS end-to-end related-context CLI behavior while preserving all previous Go/Python regression lanes.",
                      "Kept M12 Go-only, non-transitive, non-mutating, and outside safe-delete or automatic-repair authority."
                  ]
              })
          save(".workflow/changelog.json", changelog)

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = re.sub(
              r"\*\*M12 Go Related Context is validating[^\n]*\*\*",
              "**M12 Go Related Context is accepted on the development branch pending final exact-SHA promotion checks.**",
              readme,
              count=1,
          )
          readme_path.write_text(readme, encoding="utf-8")

      - name: Remove temporary finalizer from final tree
        run: git rm .github/workflows/m12-finalize.yml

      - name: Regenerate M12 sequence actual
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --root .
          --output-json docs/sequence/generated/M12-GO-RELATED-CONTEXT.actual.json
          --output-mermaid docs/sequence/generated/M12-GO-RELATED-CONTEXT.actual.mmd

      - name: Synchronize final Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .

      - name: Validate generated artifacts before commit
        run: |
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass

      - name: Commit finalized M12 state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m12): finalize accepted Go related context state"
          git push origin HEAD:work/m12-go-related-context
