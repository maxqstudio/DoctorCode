name: M24 Final Truth Sync

on:
  push:
    branches:
      - work/m24-c-cpp-semantic-baseline

permissions:
  contents: write

concurrency:
  group: m24-final-truth-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/m24-c-cpp-semantic-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Remove temporary workflow from final tree
        shell: bash
        run: rm .github/workflows/m24-final-truth-sync.yml

      - name: Bind M24 RED GREEN evidence and flow authority
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('.')
          state_path = root / '.workflow/state.json'
          acceptance_path = root / '.workflow/acceptance.json'
          session_path = root / 'docs/sequence/sessions/M24-C-CPP-SEMANTIC-BASELINE.json'
          flow_path = root / '.workflow/workflows/FLOW-C-CPP-SEMANTIC-BASELINE.json'

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          def append_unique(values, item):
              if item not in values:
                  values.append(item)

          state = load(state_path)
          state['status'] = 'M24_IMPLEMENTED_VALIDATION_PENDING'
          state['working_branch'] = 'work/m24-c-cpp-semantic-baseline'
          state['next_authorized_actions'] = [
              'Synchronize M24 Project Truth and BEFORE sequence actual evidence without widening C/C++ semantic authority.',
              'Require all eight permanent workflows to PASS on one exact synchronized M24 branch SHA, including Core C/C++ benchmark on Ubuntu/Windows/macOS and release/install regression.',
              'Only after exact branch acceptance may M24 be proposed for squash merge and exact-main revalidation.'
          ]
          stale = 'M24 C/C++ semantic analyzer behavior is not proven until the RED corpus first demonstrates the capability absent and a later exact candidate passes the corpus on Ubuntu, Windows, and macOS.'
          state['not_proven'] = [x for x in state.get('not_proven', []) if x != stale]
          for item in [
              'M24 C/C++ DEADCODE and BLOAT authority remain unavailable; no target-aware reachability or size proof is claimed.',
              'M24 parser authority is embedded gotreesitter syntax/AST only; macro expansion, compile-definition selection, target ABI/build configuration, whole-program linkage, and ambiguous standalone .h dialect inference remain NOT_PROVEN.',
              'M24 SECURITY is limited to direct credential-like string literals; composed/runtime-derived values are outside the rule.',
              'M24 SIMPLIFY and LOGIC are bounded to direct unmodified bool/_Bool parameter proof and fail closed across mutation, unsupported conditions, generated source, and semantic preprocessor ambiguity.',
              'M24 is not MAIN_ACCEPTED until one synchronized exact branch SHA passes all eight permanent workflows, squash merge completes, and exact-main revalidation passes.'
          ]:
              append_unique(state.setdefault('not_proven', []), item)
          for item in [
              'M24 RED candidate 1564c430e22d394ddef1449b1ffff73f474b905c ran Core CI 37219109211 and failed on Ubuntu, Windows, and macOS exactly at the M24 C/C++ benchmark gate because benchmark analyzer "cpp" was absent; the seven non-Core permanent workflows remained successful.',
              'M24 semantic candidate da7241f7c57d062656ed5947cf5c87143074d593 passed Core CI run 37242861899 on Ubuntu, Windows, and macOS. The 15-case C/C++ corpus reports 8 TP / 0 FP / 0 FN, aggregate precision=1.0, recall=1.0; each declared M24 rule also reports precision=1.0 and recall=1.0.',
              'M24 uses pinned gotreesitter v0.55.1 standalone C and C++ grammars with pure-Go embedded AST parsing and no new CGO dependency.'
          ]:
              append_unique(state.setdefault('proven', []), item)
          save(state_path, state)

          acceptance = load(acceptance_path)
          acceptance['sequence_mode'] = 'BEFORE'
          acceptance['sequence_session'] = 'M24-C-CPP-SEMANTIC-BASELINE'
          acceptance['evidence_boundary'] = (
              'M23 remains MAIN_ACCEPTED at product main@1f9686f2f8f560cd3637cd33c91162420e09dc39 with governance closure main@b93a50cdb89b40b2caadce425171baea3fc6ae45. '
              'M24 RED is proven at 1564c430e22d394ddef1449b1ffff73f474b905c by Core CI 37219109211 failing on Ubuntu/Windows/macOS with unknown benchmark analyzer "cpp" after all earlier Core gates passed. '
              'M24 semantic candidate da7241f7c57d062656ed5947cf5c87143074d593 passes Core CI 37242861899 on Ubuntu/Windows/macOS with 15 cases = 8 TP / 0 FP / 0 FN, precision=1.0 and recall=1.0. '
              'Authority is limited to direct-literal SECURITY, opposite-boolean SIMPLIFY, and duplicate unmodified bool/_Bool-parameter LOGIC. DEADCODE, BLOAT, macro expansion, compile-definition/target selection, whole-program linkage, ambiguous standalone .h dialect inference, safe autofix, and automatic deletion remain NOT_PROVEN. '
              'M24 is not MAIN_ACCEPTED until synchronized exact-branch acceptance, squash merge, and exact-main revalidation complete.'
          )
          requirements = {r.get('id'): r for r in acceptance.setdefault('requirements', [])}
          additions = [
              {
                  'id': 'M24-MAIN-BASELINE',
                  'requirement': 'M24 must begin from governance-accepted M23 main and use the current pinned Skill_Workflow authority before product widening.',
                  'status': 'PASS',
                  'evidence': 'work/m24-c-cpp-semantic-baseline starts from governance closure main@b93a50cdb89b40b2caadce425171baea3fc6ae45; accepted M23 product authority remains 1f9686f2f8f560cd3637cd33c91162420e09dc39; Skill_Workflow is pinned to SW2-13 4d0c3efb7bfcb8d22bf80c336e86a2a4054e49ef.'
              },
              {
                  'id': 'M24-RED-CPP-ABSENT',
                  'requirement': 'The C/C++ benchmark must prove cpp analyzer authority absent before implementation on all Core CI operating systems.',
                  'status': 'PASS',
                  'evidence': 'Core CI run 37219109211 at 1564c430e22d394ddef1449b1ffff73f474b905c failed on Ubuntu, Windows, and macOS exactly at M24 C/C++ semantic benchmark gate with unknown benchmark analyzer "cpp"; earlier Core gates passed.'
              },
              {
                  'id': 'M24-PARSER-AUTHORITY',
                  'requirement': 'Recognized C/C++ implementation source must use deterministic embedded parsing without adding CGO and must fail closed on unsupported parser/semantic boundaries.',
                  'status': 'PASS',
                  'evidence': 'cpp/gotreesitter-v1 uses the already-pinned gotreesitter v0.55.1 standalone C/C++ grammars through pure-Go embedded AST parsing. Recognized implementation extensions are .c/.cc/.cpp/.cxx; ambiguous standalone .h files are not assigned a dialect.'
              },
              {
                  'id': 'M24-BOUNDED-RULES',
                  'requirement': 'M24 must expose only bounded SECURITY, SIMPLIFY, and LOGIC rules with safe_autofix=false; C/C++ DEADCODE and BLOAT must remain unavailable.',
                  'status': 'PASS',
                  'evidence': 'cpp/gotreesitter-v1 declares exactly CPP-SEC-HARDCODED-CREDENTIAL, CPP-SIMPLIFY-BOOL-RETURN, and CPP-LOGIC-DUPLICATE-CONDITION with safe_autofix=false. No C/C++ DEADCODE or BLOAT rule is registered.'
              },
              {
                  'id': 'M24-ADVERSARIAL-GREEN',
                  'requirement': 'The labeled/adversarial/repository-shaped C/C++ corpus must pass with zero false positives and zero false negatives on Core CI Ubuntu, Windows, and macOS.',
                  'status': 'PASS',
                  'evidence': 'Core CI run 37242861899 at da7241f7c57d062656ed5947cf5c87143074d593 passes all three OS jobs. M24 corpus: 15 cases = 8 TP / 0 FP / 0 FN, precision=1.0, recall=1.0. LOGIC=2 TP, SECURITY=2 TP, SIMPLIFY=4 TP; every rule precision=1.0 and recall=1.0.'
              },
              {
                  'id': 'M24-PREPROCESSOR-HEADER-BOUNDARY',
                  'requirement': 'Preprocessor/target ambiguity and ambiguous standalone header dialects must fail closed instead of widening semantic authority.',
                  'status': 'PASS',
                  'evidence': 'The M24 corpus includes preprocessor-ambiguity, macro-ambiguity, generated-source, mutation, composed-secret, non-bool-condition, and header repository-shaped cases. Semantic preprocessor ambiguity emits no findings; standalone .h is not analyzed without dialect context.'
              }
          ]
          for entry in additions:
              if entry['id'] in requirements:
                  requirements[entry['id']].update(entry)
              else:
                  acceptance['requirements'].append(entry)
                  requirements[entry['id']] = entry
          for command in [
              'go test ./internal/analyzers/cpp ./internal/analyzers ./internal/engine ./internal/benchmark',
              'go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m24-c-cpp.json --analyzer=cpp --json'
          ]:
              append_unique(acceptance.setdefault('test_commands', []), command)
          append_unique(
              acceptance.setdefault('runtime_checks', []),
              'M24 C/C++ labeled/adversarial/repository-shaped benchmark gate on Core CI Ubuntu/Windows/macOS'
          )
          save(acceptance_path, acceptance)

          session = load(session_path)
          session['status'] = 'IN_PROGRESS'
          session['scope'] = 'CURRENT'
          session['evidence_boundary'] = (
              'M24 BEFORE plan was frozen at acdb8c1e2d2e7f9cd6c0cd1263f998d8b74664b5 before product implementation. '
              'Generic sequence extraction does not resolve Go call graphs, so DOCUMENT plan edges are design traceability only; behavioral authority is the RED/green benchmark and cumulative CI evidence. '
              'RED: 1564c430e22d394ddef1449b1ffff73f474b905c / Core 37219109211. GREEN semantic candidate: da7241f7c57d062656ed5947cf5c87143074d593 / Core 37242861899, 15 cases = 8 TP / 0 FP / 0 FN on Ubuntu/Windows/macOS.'
          )
          for test in ['internal/analyzers/cpp/analyzer_test.go', 'internal/benchmark/testdata/m24-c-cpp.json']:
              append_unique(session.setdefault('tests', []), test)
          save(session_path, session)

          flow = {
              'schema_version': 1,
              'flow_id': 'FLOW-C-CPP-SEMANTIC-BASELINE',
              'title': 'C and C++ parser-backed semantic baseline',
              'purpose': 'Provide conservative C/C++ syntax/AST evidence for bounded SECURITY, SIMPLIFY, and LOGIC rules while failing closed on preprocessor, target, linkage, generated-source, and header-dialect ambiguity.',
              'authority': 'internal/analyzers/cpp, analyzer registry, CLI benchmark selector, M24 C/C++ manifest, and permanent Core CI',
              'entry_condition': 'A visible .c, .cc, .cpp, or .cxx implementation source file is recognized outside ignored build/generated directories.',
              'source_owners': [
                  'internal/analyzers/cpp/analyzer.go',
                  'internal/analyzers/cpp/parser.go',
                  'internal/analyzers/cpp/analyzer_test.go',
                  'internal/analyzers/registry.go',
                  'cmd/doctorcode/main.go',
                  'internal/benchmark/testdata/m24-c-cpp.json',
                  '.github/workflows/ci.yml'
              ],
              'states': ['SOURCE_DISCOVERY','STRICT_PARSE','BOUNDARY_FILTER','BOUNDED_RULE_PROOF','FINDING_CONTRACT_VALIDATE','DETERMINISTIC_OUTPUT'],
              'transitions': [
                  {'from':'SOURCE_DISCOVERY','to':'STRICT_PARSE','action':'Discover visible C/C++ implementation source while excluding symlinks and ignored build/generated directories; do not infer a dialect for standalone .h files.','side_effects':[]},
                  {'from':'STRICT_PARSE','to':'BOUNDARY_FILTER','action':'Parse with pinned embedded gotreesitter C/C++ grammar selected by implementation extension.','side_effects':[]},
                  {'from':'BOUNDARY_FILTER','to':'BOUNDED_RULE_PROOF','action':'Skip generated source and fail closed when semantic preprocessor/macro ambiguity is visible.','side_effects':[]},
                  {'from':'BOUNDED_RULE_PROOF','to':'FINDING_CONTRACT_VALIDATE','action':'Evaluate direct-literal SECURITY, opposite-boolean SIMPLIFY, and duplicate unmodified bool/_Bool-parameter LOGIC without DEADCODE/BLOAT claims.','side_effects':[]},
                  {'from':'FINDING_CONTRACT_VALIDATE','to':'DETERMINISTIC_OUTPUT','action':'Validate declared rule/category/autofix metadata and deterministic finding identity before output.','side_effects':[]}
              ],
              'invariants': [
                  'M24 does not claim C/C++ DEADCODE or BLOAT authority.',
                  'safe_autofix is false for every M24 finding.',
                  'Credential literal evidence never exposes the literal value.',
                  'Macro expansion, conditional-compilation selection, target ABI/build configuration, and whole-program linkage remain NOT_PROVEN.',
                  'Standalone .h files do not receive a guessed C or C++ dialect.',
                  'Generated source and semantic preprocessor ambiguity cannot establish positive findings.',
                  'LOGIC is limited to direct unmodified bool/_Bool parameters in the nearest function proof subset.'
              ],
              'tests': ['internal/analyzers/cpp/analyzer_test.go','internal/benchmark/testdata/m24-c-cpp.json'],
              'sequence_session': 'M24-C-CPP-SEMANTIC-BASELINE',
              'critical': False,
              'failure_behavior': ['Unsupported C/C++ semantic ambiguity emits no finding rather than widening proof.','Recognized implementation-source parse failures block analysis for that source set.'],
              'restart_behavior': ['C/C++ analysis is read-only and deterministic for a fixed visible source tree.'],
              'rollback_behavior': ['M24 is read-only; rollback is source-control only and requires no data migration.']
          }
          save(flow_path, flow)

      - name: Generate M24 actual sequence evidence
        shell: bash
        run: |
          python .workflow/tools/generate_sequence_actual.py \
            --root . \
            --output-json docs/sequence/generated/M24-C-CPP-SEMANTIC-BASELINE.actual.json \
            --output-mermaid docs/sequence/generated/M24-C-CPP-SEMANTIC-BASELINE.actual.mmd
          python - <<'PY'
          import json
          from pathlib import Path
          session_path = Path('docs/sequence/sessions/M24-C-CPP-SEMANTIC-BASELINE.json')
          actual_path = Path('docs/sequence/generated/M24-C-CPP-SEMANTIC-BASELINE.actual.json')
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = json.loads(actual_path.read_text(encoding='utf-8'))
          session['actual']['source_digest'] = actual['source_digest']
          session['actual']['entries'] = actual.get('entries', [])
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Synchronize Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .

      - name: Validate generated outputs before commit
        shell: bash
        run: |
          python .workflow/tools/validate_schema_toolchain.py --root .
          python .workflow/tools/validate_repository_health.py --root . --require-owner-approved-license
          python .workflow/tools/validate_project_docs.py --root .
          python .workflow/tools/validate_doc_quality.py --root .
          python .workflow/tools/validate_human_comprehension.py --root . --require-pass
          python .workflow/tools/validate_handoff.py --root .
          python .workflow/tools/validate_sequence_sessions.py --root .

      - name: Commit synchronized M24 truth locally
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(m24): synchronize C/C++ Project Truth'

      - name: Validate clean committed M24 truth
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          python .workflow/tools/validate_cross_document_consistency.py --base cd05f064e1bb1054271e7028941c1fbb80ea32aa --require-base
          python .workflow/tools/validate_project_truth.py --root .
          python .workflow/tools/validate_sequence_sessions.py --root .
          python .workflow/tools/validate_schema_toolchain.py --root .

      - name: Push synchronized M24 truth
        shell: bash
        run: git push origin HEAD:work/m24-c-cpp-semantic-baseline
