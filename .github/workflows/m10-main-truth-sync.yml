name: M10 Main Truth Sync

on:
  push:
    branches:
      - "work/m10-main-truth-sync"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/m10-main-truth-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Remove temporary sync workflow from final tree
        run: git rm .github/workflows/m10-main-truth-sync.yml
      - name: Generate current M10 sequence actual
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --root .
          --output-json docs/sequence/generated/M10-PYTHON-LABELED-REAL-WORLD.actual.json
          --output-mermaid docs/sequence/generated/M10-PYTHON-LABELED-REAL-WORLD.actual.mmd
      - name: Validate current M10 sequence
        run: >
          python .workflow/tools/validate_sequence_contract.py
          --root .
          --session docs/sequence/sessions/M10-PYTHON-LABELED-REAL-WORLD.json
      - name: Synchronize generated Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .
      - name: Validate generated artifacts before final commit
        run: |
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
      - name: Commit synchronized main truth
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m10): synchronize accepted main truth"
          git push origin HEAD:work/m10-main-truth-sync
