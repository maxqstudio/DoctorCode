name: M02 Doc Sync

on:
  push:
    branches:
      - "work/m02-precision-benchmark"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate current M02 sequence evidence
        run: |
          python .workflow/tools/generate_sequence_actual.py --output-json docs/sequence/generated/M02-PRECISION-BENCHMARK.actual.json --output-mermaid docs/sequence/generated/M02-PRECISION-BENCHMARK.actual.mmd
      - name: Synchronize Project Truth docs
        run: python .workflow/tools/sync_project_truth.py
      - name: Commit deterministic generated docs
        shell: bash
        run: |
          git add docs .workflow/generated .workflow/acceptance.json
          if git diff --cached --quiet; then
            echo "No generated documentation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync M02 project truth"
          git push origin HEAD:"$GITHUB_REF_NAME"
