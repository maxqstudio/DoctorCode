name: M16 Final Truth Sync

on:
  push:
    branches:
      - "work/m16-thin-mcp-adapter"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/m16-thin-mcp-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Regenerate M16 sequence actual
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --root .
          --output-json docs/sequence/generated/M16-THIN-MCP-ADAPTER.actual.json
          --output-mermaid docs/sequence/generated/M16-THIN-MCP-ADAPTER.actual.mmd
      - name: Synchronize Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .
      - name: Commit generated truth
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow/acceptance.json .workflow/generated docs
          if git diff --cached --quiet; then
            echo "PROJECT_TRUTH_DRIFT=NONE"
            exit 0
          fi
          git commit -m "docs(m16): finalize hardened MCP project truth"
          git push origin HEAD:work/m16-thin-mcp-adapter
