name: Temporary M26 Sync Parser Proof

on:
  push:
    branches:
      - work/m26-dart-flutter-semantic

permissions:
  contents: write

jobs:
  sync-parser-proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate M26 ACTUAL and canonical Project Truth without temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-m26-sync-parser-proof.yml
          python .workflow/tools/generate_sequence_actual.py --root . \
            --output-json docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.json \
            --output-mermaid docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.mmd
          python - <<'PY'
          import json
          from pathlib import Path

          graph_path = Path("docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.json")
          session_path = Path("docs/sequence/sessions/M26-DART-FLUTTER-SEMANTIC-BASELINE.json")
          graph = json.loads(graph_path.read_text(encoding="utf-8"))
          session = json.loads(session_path.read_text(encoding="utf-8"))
          assert graph["generated_by"] == "generate_sequence_actual.py"
          assert graph["source_digest"]
          assert session["actual"]["graph"] == graph_path.as_posix()
          assert session["actual"]["entries"] == graph["entries"]
          session["actual"]["source_digest"] = graph["source_digest"]
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n")
          print("M26_SESSION_DIGEST_FROM_GENERATED_ACTUAL=PASS")
          PY
          python .workflow/tools/sync_project_truth.py --root .
      - name: Create clean local validation snapshot
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore(m26): local Dart parser proof validation snapshot'
          test -z "$(git status --porcelain)"
          echo "VALIDATION_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate canonical governance on clean tree
        shell: bash
        run: |
          python .workflow/tools/validate_schema_toolchain.py --root .
          python .workflow/tools/validate_repository_health.py --root . --require-owner-approved-license
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_cross_document_consistency.py --base cd05f064e1bb1054271e7028941c1fbb80ea32aa --require-base
          python .workflow/tools/validate_project_truth.py
          python .workflow/tools/validate_sequence_sessions.py
          test "$VALIDATION_TREE" = "$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"
      - name: Prove strict Dart parser on Ubuntu
        shell: bash
        run: go test ./internal/analyzers/dart -count=1 -v
      - name: Push clean parser-proof candidate without helper workflow
        shell: bash
        run: |
          test ! -e .github/workflows/tmp-m26-sync-parser-proof.yml
          test "$VALIDATION_TREE" = "$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"
          git push origin HEAD:work/m26-dart-flutter-semantic
          echo "PARSER_PROOF_CANDIDATE_SHA=$(git rev-parse HEAD)"
