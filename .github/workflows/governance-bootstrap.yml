name: Governance Bootstrap

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-project-truth:
    name: strict-skill-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Synchronize M18 project truth
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/m18-javascript-typescript-semantic'
        run: |
          python .workflow/tools/sync_project_truth.py
          python .workflow/tools/generate_sequence_actual.py --output-json docs/sequence/generated/M18-JAVASCRIPT-TYPESCRIPT-SEMANTIC.actual.json --output-mermaid docs/sequence/generated/M18-JAVASCRIPT-TYPESCRIPT-SEMANTIC.actual.mmd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add .workflow/generated/code_facts.json .workflow/acceptance.json docs
            git commit -m "docs(m18): synchronize project truth"
            git push
            echo "Project Truth synchronized; pushed commit will run authoritative validation."
            exit 0
          fi
      - name: Validate tracked project docs
        run: python .workflow/tools/validate_project_docs.py
      - name: Validate doc quality
        run: python .workflow/tools/validate_doc_quality.py
      - name: Validate human comprehension
        run: python .workflow/tools/validate_human_comprehension.py --require-pass
      - name: Validate handoff
        run: python .workflow/tools/validate_handoff.py
      - name: Validate cross-document consistency
        run: python .workflow/tools/validate_cross_document_consistency.py --base cd05f064e1bb1054271e7028941c1fbb80ea32aa --require-base
      - name: Validate project truth
        run: python .workflow/tools/validate_project_truth.py
      - name: Validate sequence sessions
        run: python .workflow/tools/validate_sequence_sessions.py
