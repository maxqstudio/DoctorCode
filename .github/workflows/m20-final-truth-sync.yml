name: M20 Final Truth Sync

on:
  push:
    branches:
      - work/m20-js-ts-parser-foundation

permissions:
  contents: write

concurrency:
  group: m20-final-truth-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Synchronize governed M20 truth
        run: |
          python .workflow/tools/sync_project_truth.py
          python .workflow/tools/generate_sequence_actual.py --output-json docs/sequence/generated/M20-JAVASCRIPT-TYPESCRIPT-PARSER.actual.json --output-mermaid docs/sequence/generated/M20-JAVASCRIPT-TYPESCRIPT-PARSER.actual.mmd
      - name: Commit synchronized generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git add .workflow/generated/code_facts.json .workflow/acceptance.json docs
            git commit -m "docs(m20): finalize governed parser truth"
            git push
          fi
