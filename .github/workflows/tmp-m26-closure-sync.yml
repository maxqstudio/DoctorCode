name: Temporary M26 Closure Facts Sync
on:
  push:
    branches:
      - work/m26-finalize-closure
permissions:
  contents: write
jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Remove temporary helper before candidate snapshot
        shell: bash
        run: |
          rm .github/workflows/tmp-m26-closure-sync.yml
          go test ./... -count=1
          go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m26-dart-flutter.json --analyzer=dart --json
          go vet ./...
      - name: Regenerate ACTUAL and Project Truth from official generators
        shell: bash
        run: |
          python .workflow/tools/generate_sequence_actual.py --root . \
            --output-json docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.json \
            --output-mermaid docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.mmd
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("docs/sequence/sessions/M26-DART-FLUTTER-SEMANTIC-BASELINE.json")
          graphpath=Path("docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          graph=json.loads(graphpath.read_text(encoding="utf-8"))
          assert graph["generated_by"]=="generate_sequence_actual.py"
          assert data["actual"]["entries"]==graph["entries"]
          data["actual"]["source_digest"]=graph["source_digest"]
          path.write_text(json.dumps(data,indent=2,sort_keys=True)+"\n",encoding="utf-8",newline="\n")
          PY
          python .workflow/tools/sync_project_truth.py --root .
      - name: Seal clean governance tree
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(m26): synchronize bounded final acceptance authority'
          test ! -e .github/workflows/tmp-m26-closure-sync.yml
          test -z "$(git status --porcelain)"
          echo "CLEAN_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - name: Check strict governance on sealed tree
        shell: bash
        run: |
          python .workflow/tools/validate_schema_toolchain.py --root .
          python .workflow/tools/validate_repository_health.py --root . --require-owner-approved-license
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_cross_document_consistency.py --base cd05f064e1bb1054271e7028941c1fbb80ea32aa --require-base
          python .workflow/tools/validate_project_truth.py
          python .workflow/tools/validate_sequence_sessions.py
          test -z "$(git status --porcelain)"
          test "$CLEAN_TREE" = "$(git rev-parse HEAD^{tree})"
      - name: Push sealed M26 closure candidate
        shell: bash
        run: |
          git push origin HEAD:work/m26-finalize-closure
          echo "M26_SEALED_CLOSURE_SHA=$(git rev-parse HEAD)"
