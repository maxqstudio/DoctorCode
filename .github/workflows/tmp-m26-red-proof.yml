name: Temporary M26 Dart RED Proof

on:
  push:
    branches:
      - work/m26-dart-flutter-semantic

permissions:
  contents: read

concurrency:
  group: tmp-m26-dart-red-proof
  cancel-in-progress: true

jobs:
  prove-red:
    name: red-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prove Dart benchmark analyzer is absent
        shell: bash
        run: |
          set +e
          output="$(go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m26-dart-flutter.json --analyzer=dart --json 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F 'unknown benchmark analyzer "dart"'
