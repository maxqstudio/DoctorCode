name: Temporary M26 Semantic Authority Sync
on:
  push:
    branches:
      - work/m26-dart-flutter-semantic
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Normalize source and remove helper from candidate tree
        shell: bash
        run: |
          rm .github/workflows/tmp-m26-semantic-sync.yml
          gofmt -w internal/analyzers/dart/analyzer.go internal/analyzers/dart/analyzer_test.go internal/analyzers/registry.go internal/analyzers/registry_test.go cmd/doctorcode/main.go
          test ! -e .github/workflows/tmp-m26-semantic-sync.yml
      - name: Validate semantic rules before regenerating authorities
        shell: bash
        run: |
          go test ./... -count=1
          go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m26-dart-flutter.json --analyzer=dart --json
          go vet ./...
      - name: Generate M26 ACTUAL and canonical Project Truth
        shell: bash
        run: |
          python .workflow/tools/generate_sequence_actual.py --root . \
            --output-json docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.json \
            --output-mermaid docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.mmd
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/sequence/sessions/M26-DART-FLUTTER-SEMANTIC-BASELINE.json")
          graph_path = Path("docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.json")
          session = json.loads(path.read_text(encoding="utf-8"))
          graph = json.loads(graph_path.read_text(encoding="utf-8"))
          assert graph["generated_by"] == "generate_sequence_actual.py"
          assert session["actual"]["graph"] == graph_path.as_posix()
          assert session["actual"]["entries"] == graph["entries"]
          assert graph["source_digest"]
          session["actual"]["source_digest"] = graph["source_digest"]
          path.write_text(json.dumps(session, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n")
          print("M26_SESSION_DIGEST_FROM_GENERATED_ACTUAL=PASS")
          PY
          python .workflow/tools/sync_project_truth.py --root .
      - name: Commit clean semantic authority snapshot
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --name-only
          git commit -m 'chore(m26): synchronize bounded Dart semantic source authority'
          test ! -e .github/workflows/tmp-m26-semantic-sync.yml
          test -z "$(git status --porcelain)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - name: Validate complete governance on clean tree
        shell: bash
        run: |
          python .workflow/tools/validate_schema_toolchain.py --root .
          python .workflow/tools/validate_repository_health.py --root . --require-owner-approved-license
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_cross_document_consistency.py --base cd05f064e1bb1054271e7028941c1fbb80ea32aa --require-base
          python .workflow/tools/validate_project_truth.py
          python .workflow/tools/validate_sequence_sessions.py
          test "$CANDIDATE_TREE" = "$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"
      - name: Push clean semantic candidate
        shell: bash
        run: |
          test ! -e .github/workflows/tmp-m26-semantic-sync.yml
          git push origin HEAD:work/m26-dart-flutter-semantic
          echo "SEMANTIC_CANDIDATE_SHA=$(git rev-parse HEAD)"
