name: Temporary M26 Declare RED Gate

on:
  push:
    branches:
      - work/m26-dart-flutter-semantic

permissions:
  contents: write

concurrency:
  group: tmp-m26-declare-red-gate
  cancel-in-progress: true

jobs:
  declare-red-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/m26-dart-flutter-semantic
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Add permanent M26 Core CI RED gate
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          needle = '''      - name: M25 CSharp .NET semantic benchmark gate\n        run: go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m25-csharp.json --analyzer=csharp --json\n'''
          addition = needle + '''      - name: M26 Dart Flutter semantic benchmark gate\n        run: go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m26-dart-flutter.json --analyzer=dart --json\n'''
          assert text.count(needle) == 1
          assert 'M26 Dart Flutter semantic benchmark gate' not in text
          path.write_text(text.replace(needle, addition), encoding='utf-8', newline='\n')
      - name: Bind RED declaration into governance authority
        shell: python
        run: |
          import json
          from pathlib import Path

          state_path = Path('.workflow/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['status'] = 'M26_RED_GATE_DECLARED_PROOF_PENDING'
          state['next_authorized_actions'] = [
            'Prove the permanent M26 Core CI Dart benchmark gate fails on Ubuntu, Windows, and macOS at one exact SHA because analyzer dart is still absent.',
            'Do not implement the Dart analyzer until that exact 3-OS permanent-gate RED is observed and recorded.',
            'After RED proof is bound, implement only the frozen M26 Dart/Flutter semantic boundary and repair until the 12-case corpus plus cumulative acceptance pass.'
          ]
          corpus = 'M26 RED corpus is frozen at 535fe3fb4ab9f0cbcef51d8222d2cc86dc852ba1 with 12 labeled/adversarial/Flutter-shaped cases covering bounded SECURITY/SIMPLIFY/LOGIC positives, generated-code negatives, async/nullability, widget-shaped syntax, and pubspec-backed Flutter shape.'
          if corpus not in state['proven']:
            state['proven'].append(corpus)
          temp_proof = 'M26 pre-gate RED proof run 37405618811 at 12cd9a404457b9a502433f265042e6f36c4e6537 proved the dart benchmark analyzer absent on Ubuntu, Windows, and macOS via the expected unknown benchmark analyzer error; permanent Core CI RED remains the required implementation gate.'
          if temp_proof not in state['proven']:
            state['proven'].append(temp_proof)
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          acceptance_path = Path('.workflow/acceptance.json')
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          ids = {item.get('id') for item in acceptance.get('requirements', [])}
          requirement = {
            'id': 'M26-RED-CORPUS',
            'requirement': 'M26 must freeze a labeled/adversarial/Flutter-shaped corpus and declare a permanent Core CI benchmark gate before Dart analyzer implementation.',
            'status': 'PASS',
            'evidence': 'Corpus commit 535fe3fb4ab9f0cbcef51d8222d2cc86dc852ba1 defines 12 cases; this governance commit adds the permanent M26 Core CI command using --analyzer=dart. Analyzer authority remains absent and permanent-gate RED proof is still pending.'
          }
          if requirement['id'] not in ids:
            acceptance.setdefault('requirements', []).append(requirement)
          acceptance_path.write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
      - name: Remove temporary workflow before final sync
        run: rm .github/workflows/tmp-m26-declare-red-gate.yml
      - name: Synchronize Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .
      - name: Validate pre-commit RED declaration truth
        shell: bash
        run: |
          python .workflow/tools/validate_schema_toolchain.py --root .
          python .workflow/tools/validate_repository_health.py --root . --require-owner-approved-license
          python .workflow/tools/validate_project_docs.py --root .
          python .workflow/tools/validate_doc_quality.py --root .
          python .workflow/tools/validate_human_comprehension.py --root . --require-pass
          python .workflow/tools/validate_handoff.py --root .
      - name: Commit RED declaration locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(m26): bind permanent Dart RED gate"
      - name: Validate clean committed RED declaration
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          python .workflow/tools/validate_cross_document_consistency.py --base 0b48d79f5881291054a65db9ae14f2ba3f1bcc29 --require-base
          python .workflow/tools/validate_project_truth.py --root .
          python .workflow/tools/validate_sequence_sessions.py --root .
      - name: Push validated RED declaration
        run: git push origin HEAD:work/m26-dart-flutter-semantic
