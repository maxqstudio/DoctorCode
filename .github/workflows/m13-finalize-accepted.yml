name: M13 Finalize Accepted State

on:
  push:
    branches:
      - "work/m13-python-related-context"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/m13-python-related-context
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Record exact M13 accepted evidence
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, data):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          exact_sha = "80f735c7be3598dfdf34b6a040d3e49464298a42"

          state = load(".workflow/state.json")
          state["status"] = "M13_ACCEPTED"
          exact_proven = [
              "Final synchronized M13 branch tree " + exact_sha + " passed Governance Bootstrap run 36326117052.",
              "Core CI run 36326116923 at " + exact_sha + " passed on ubuntu-latest, windows-latest, and macos-latest.",
              "M10 Python labels run 36326117037, M07 Python Real World run 36326116936, M06 Go labels run 36326116920, and Real World Go run 36326116988 all passed on Linux, Windows, and macOS at " + exact_sha + "."
          ]
          for item in exact_proven:
              if item not in state["proven"]:
                  state["proven"].append(item)
          state["next_authorized_actions"] = [
              "Run final exact-SHA acceptance on the M13_ACCEPTED tree after this governance finalization commit.",
              "Open and merge the FINAL_ACCEPTED M13 pull request to main.",
              "Rerun Governance Bootstrap, Core CI, and every accepted real-world lane on the exact main merge SHA before M14.",
              "After M13_MAIN_ACCEPTED, proceed to the deterministic verification contract milestone under the Owner directive to continue until DoctorCode is complete."
          ]
          state["blocked_actions"] = [
              "Starting M14 before exact M13 main post-merge acceptance.",
              "Claiming Python related context is a complete dynamic dependency graph.",
              "Treating related context as proof that code is safe to delete or auto-fix.",
              "Starting MCP or Skill adapters before deterministic verification contracts are accepted."
          ]
          save(".workflow/state.json", state)

          acceptance = load(".workflow/acceptance.json")
          for req in acceptance["requirements"]:
              if req["id"] == "M13-STRICT-GOVERNANCE-FINAL":
                  req["status"] = "PASS"
                  req["evidence"] = (
                      "At " + exact_sha + ": Governance Bootstrap 36326117052, Core CI 36326116923, "
                      "M10 Labeled Real World Python 36326117037, M07 Python Real World 36326116936, "
                      "M06 Labeled Real World Go 36326116920, and Real World Go Validation 36326116988 "
                      "all completed success; every matrix job passed on Linux, Windows, and macOS."
                  )
          for key in ("CROSS_DOCUMENT_CONSISTENCY", "PROJECT_STATE_SYNC", "SEQUENCE_SYNC"):
              acceptance.setdefault("truth_gates", {})[key] = "PASS"
          save(".workflow/acceptance.json", acceptance)

          claims = load(".workflow/claims.json")
          if not any(x["id"] == "TRUTH-M13-BRANCH-ACCEPTED" for x in claims["claims"]):
              claims["claims"].append({
                  "id": "TRUTH-M13-BRANCH-ACCEPTED",
                  "claim": "The synchronized M13 Python Related Context branch tree passed strict governance plus every accepted Linux, Windows, and macOS regression lane before promotion.",
                  "documents": ["PROJECT_TRUTH_SYNC.md"],
                  "source_owners": [".workflow/state.json", ".workflow/acceptance.json"],
                  "tests": [
                      ".github/workflows/governance-bootstrap.yml",
                      ".github/workflows/ci.yml",
                      ".github/workflows/m10-python-labeled-real-world.yml",
                      ".github/workflows/m07-python-real-world.yml",
                      ".github/workflows/m06-labeled-real-world.yml",
                      ".github/workflows/real-world-go.yml"
                  ],
                  "runtime_evidence": [
                      "GitHub Actions Governance Bootstrap run 36326117052 at " + exact_sha,
                      "GitHub Actions Core CI run 36326116923 at " + exact_sha,
                      "GitHub Actions M10 Labeled Real World Python run 36326117037 at " + exact_sha,
                      "GitHub Actions M07 Python Real World run 36326116936 at " + exact_sha,
                      "GitHub Actions M06 Labeled Real World Go run 36326116920 at " + exact_sha,
                      "GitHub Actions Real World Go Validation run 36326116988 at " + exact_sha
                  ],
                  "status": "PASS"
              })
          save(".workflow/claims.json", claims)

          changelog = load(".workflow/changelog.json")
          if not any(x.get("title") == "M13 Python Related Context accepted baseline" for x in changelog["entries"]):
              changelog["entries"].insert(0, {
                  "date": "2026-09-27",
                  "title": "M13 Python Related Context accepted baseline",
                  "type": "acceptance",
                  "changes": [
                      "Accepted bounded Python production/test related context for eligible module-level function findings.",
                      "Accepted lexical-shadow exclusion and fail-closed selected-name module rebinding behavior.",
                      "Accepted schema-v2 Go/Python related-context parity under the same max-bytes and excerpt-cap contract.",
                      "Accepted Linux, Windows, and macOS public CLI E2E behavior while preserving all prior real-world regression lanes.",
                      "Kept dynamic Python resolution, transitive graphs, safe deletion, and automatic repair outside M13 authority."
                  ]
              })
          save(".workflow/changelog.json", changelog)

          session = load("docs/sequence/sessions/M13-PYTHON-RELATED-CONTEXT.json")
          session["status"] = "ACCEPTED"
          save("docs/sequence/sessions/M13-PYTHON-RELATED-CONTEXT.json", session)

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = re.sub(
              r"\*\*M13 Python Related Context is validating on work/m13-python-related-context from governance-normalized M12 main@25ce40a8d60aa0dad8fe50f6d8bcb945dad2482d\.\*\*",
              "**M13 Python Related Context is accepted on the development branch pending final exact-SHA promotion checks.**",
              readme,
              count=1,
          )
          readme_path.write_text(readme, encoding="utf-8")

      - name: Remove temporary finalizer
        run: git rm .github/workflows/m13-finalize-accepted.yml

      - name: Regenerate M13 sequence actual
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --root .
          --output-json docs/sequence/generated/M13-PYTHON-RELATED-CONTEXT.actual.json
          --output-mermaid docs/sequence/generated/M13-PYTHON-RELATED-CONTEXT.actual.mmd

      - name: Validate M13 sequence
        run: >
          python .workflow/tools/validate_sequence_contract.py
          --root .
          --session docs/sequence/sessions/M13-PYTHON-RELATED-CONTEXT.json

      - name: Synchronize generated Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .

      - name: Validate final generated artifacts
        run: |
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass

      - name: Commit finalized M13 governance
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m13): finalize accepted Python related context state"
          git push origin HEAD:work/m13-python-related-context
