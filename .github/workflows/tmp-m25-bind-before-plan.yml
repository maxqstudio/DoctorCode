name: Temporary M25 Bind BEFORE Plan

on:
  push:
    branches:
      - work/m25-csharp-dotnet-semantic-baseline

permissions:
  contents: write

concurrency:
  group: tmp-m25-bind-before-plan
  cancel-in-progress: true

jobs:
  bind-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/m25-csharp-dotnet-semantic-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bind M25 BEFORE session and acceptance inputs
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path

          plan_path = Path('docs/sequence/plans/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.plan.json')
          plan_sha = hashlib.sha256(plan_path.read_bytes()).hexdigest()
          assert plan_sha == '238ca3c7894d0d7978587c8ca68a6e42a8ed26eb1425fa78edbb160ec37db518', plan_sha

          session = {
            'schema_version': 1,
            'session_id': 'M25-CSHARP-DOTNET-SEMANTIC-BASELINE',
            'phase': 'M25_CSHARP_DOTNET_SEMANTIC_BASELINE',
            'mode': 'BEFORE',
            'scope': 'CURRENT',
            'critical': False,
            'status': 'IN_PROGRESS',
            'implementation_base_sha': 'ab5c6e3b58369b3675eb3d5291f751a0657641d5',
            'plan': {
              'required': True,
              'contract': 'docs/sequence/plans/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.plan.json',
              'frozen': True,
              'frozen_commit': 'ab5c6e3b58369b3675eb3d5291f751a0657641d5',
              'sha256': plan_sha,
              'diagram': 'docs/sequence/generated/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.plan.mmd'
            },
            'actual': {
              'graph': 'docs/sequence/generated/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.actual.json',
              'diagram': 'docs/sequence/generated/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.actual.mmd',
              'source_digest': '',
              'entries': []
            },
            'test_traceability_required': True,
            'tests': ['internal/benchmark/testdata/m25-csharp.json', 'internal/analyzers/csharp/analyzer_test.go'],
            'runtime_trace': {'required': False, 'graph': ''},
            'acceptance_report': '',
            'evidence_boundary': 'M25 BEFORE plan was frozen at ab5c6e3b58369b3675eb3d5291f751a0657641d5 before C# product implementation. DOCUMENT edges are design traceability only because generic extraction does not resolve Go call graphs or .NET build semantics. Behavioral authority must come from RED/green benchmark and cumulative multi-OS CI evidence. Historical M19-M24 sequence evidence remains content-addressed and immutable under SW2-16 Historical Evidence Freeze.'
          }
          sp = Path('docs/sequence/sessions/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.json')
          sp.parent.mkdir(parents=True, exist_ok=True)
          sp.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          state_path = Path('.workflow/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['status'] = 'M25_PLANNED_RED_PENDING'
          state['working_branch'] = 'work/m25-csharp-dotnet-semantic-baseline'
          state['next_authorized_actions'] = [
            'Declare a C# labeled/adversarial/repository-shaped RED corpus and permanent Core CI gate before implementing the C# analyzer.',
            'Prove the C# benchmark analyzer absent on Ubuntu, Windows, and macOS at one exact RED SHA.',
            'Only after valid 3-OS RED may C# analyzer implementation begin within the frozen M25 semantic boundary.'
          ]
          proof = 'M25 prerequisite exact tree 932b92c3d910818ec631eae8a567e1ace21d8a62 passed all eight permanent workflows after adopting accepted Skill_Workflow SW2-16 Historical Evidence Freeze at 7e2c5e4669655764e24ec821cefc0c96e2886133.'
          if proof not in state['proven']:
            state['proven'].append(proof)
          provider = 'M25 parser/provider selection is gotreesitter v0.55.1 standalone grammars/c_sharp, preserving pure-Go/no-CGO syntax authority; no Roslyn or .NET runtime is required for parsing.'
          if provider not in state['proven']:
            state['proven'].append(provider)
          for item in [
            'M25 C# DEADCODE and BLOAT authority are not proven and remain unavailable.',
            'M25 does not prove MSBuild evaluation, NuGet/project-reference resolution, Roslyn semantic binding, source-generator execution, reflection/attribute reachability, overload resolution, nullable-flow analysis, whole-program reachability, safe autofix, or automatic deletion.',
            'M25 project/solution awareness may represent .csproj/.sln scope and generated-code boundaries but must fail closed rather than infer unproven build semantics.'
          ]:
            if item not in state['not_proven']:
              state['not_proven'].append(item)
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          acceptance_path = Path('.workflow/acceptance.json')
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          acceptance['sequence_mode'] = 'BEFORE'
          acceptance['sequence_session'] = 'M25-CSHARP-DOTNET-SEMANTIC-BASELINE'
          acceptance['evidence_boundary'] = 'M24 is MAIN_ACCEPTED and governance-closed. M25 BEFORE plan is frozen at ab5c6e3b58369b3675eb3d5291f751a0657641d5 before C# implementation. Skill_Workflow SW2-16 Historical Evidence Freeze is active with immutable M19-M24 historical identities. M25 has selected gotreesitter v0.55.1 c_sharp as pure-Go/no-CGO syntax authority, but no C# semantic capability is accepted yet. DEADCODE/BLOAT, MSBuild/NuGet/Roslyn/source-generator/reflection/whole-program semantics, safe autofix, and automatic deletion remain outside authority.'
          ids = {item.get('id') for item in acceptance.get('requirements', [])}
          requirements = [
            {
              'id':'M25-HISTORICAL-FREEZE',
              'requirement':'M25 must begin only after accepted historical M19-M24 sequence evidence is frozen under the latest accepted SW2-16 contract.',
              'status':'PASS',
              'evidence':'SW2-16 authority 7e2c5e4669655764e24ec821cefc0c96e2886133 was vendored and historical evidence frozen against accepted main@9652e8d50752059e6ad14d00c9c4e3be5da14bf7; exact proof tree 932b92c3d910818ec631eae8a567e1ace21d8a62 completed all eight permanent workflows successfully.'
            },
            {
              'id':'M25-BEFORE-PLAN',
              'requirement':'M25 semantic flow and unsafe-claim boundaries must be frozen before product implementation.',
              'status':'PASS',
              'evidence':'docs/sequence/plans/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.plan.json SHA-256 238ca3c7894d0d7978587c8ca68a6e42a8ed26eb1425fa78edbb160ec37db518 was committed at ab5c6e3b58369b3675eb3d5291f751a0657641d5 before any M25 product implementation.'
            },
            {
              'id':'M25-PARSER-PROVIDER',
              'requirement':'M25 must select a deterministic cross-platform C# parser/provider without introducing CGO or requiring .NET runtime execution for syntax parsing.',
              'status':'PASS',
              'evidence':'Pinned github.com/odvcencio/gotreesitter v0.55.1 contains standalone grammars/c_sharp/c_sharp.go; M25 will reuse that embedded pure-Go provider.'
            }
          ]
          for req in requirements:
            if req['id'] not in ids:
              acceptance.setdefault('requirements', []).append(req)
          acceptance_path.write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
      - name: Generate canonical plan diagram
        shell: python
        run: |
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.workflow/tools').resolve()))
          from sequence_contract import load_json, render_graph_mermaid, sha256_file
          plan_path = Path('docs/sequence/plans/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.plan.json')
          plan = load_json(plan_path)
          out = Path('docs/sequence/generated/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.plan.mmd')
          out.parent.mkdir(parents=True, exist_ok=True)
          text = '%% GENERATED FILE - DO NOT EDIT\n' + f'%% PLAN_SHA256: {sha256_file(plan_path)}\n' + f'%% FLOW_ID: {plan.get("flow_id", "")}\n' + render_graph_mermaid(plan)
          out.write_text(text, encoding='utf-8', newline='\n')
      - name: Generate current ACTUAL baseline
        run: >-
          python .workflow/tools/generate_sequence_actual.py
          --output-json docs/sequence/generated/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.actual.json
          --output-mermaid docs/sequence/generated/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.actual.mmd
      - name: Bind generated ACTUAL digest into session
        shell: python
        run: |
          import json
          from pathlib import Path
          sp = Path('docs/sequence/sessions/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.json')
          ap = Path('docs/sequence/generated/M25-CSHARP-DOTNET-SEMANTIC-BASELINE.actual.json')
          session = json.loads(sp.read_text(encoding='utf-8'))
          actual = json.loads(ap.read_text(encoding='utf-8'))
          session['actual']['source_digest'] = actual['source_digest']
          session['actual']['entries'] = actual.get('entries', [])
          sp.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
      - name: Remove temporary workflow before final sync
        run: rm .github/workflows/tmp-m25-bind-before-plan.yml
      - name: Synchronize Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .
      - name: Validate pre-commit M25 plan truth
        shell: bash
        run: |
          python .workflow/tools/validate_schema_toolchain.py --root .
          python .workflow/tools/validate_repository_health.py --root . --require-owner-approved-license
          python .workflow/tools/validate_project_docs.py --root .
          python .workflow/tools/validate_doc_quality.py --root .
          python .workflow/tools/validate_human_comprehension.py --root . --require-pass
          python .workflow/tools/validate_handoff.py --root .
      - name: Commit M25 plan binding locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(m25): bind frozen CSharp .NET BEFORE plan"
      - name: Validate clean committed M25 plan
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          python .workflow/tools/validate_cross_document_consistency.py --base ab5c6e3b58369b3675eb3d5291f751a0657641d5 --require-base
          python .workflow/tools/validate_project_truth.py --root .
          python .workflow/tools/validate_sequence_sessions.py --root .
      - name: Push validated M25 plan binding
        run: git push origin HEAD:work/m25-csharp-dotnet-semantic-baseline
