name: M20 MCP Dependency Lock

on:
  push:
    branches:
      - work/m20-js-ts-parser-foundation

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache: false
      - name: Lock MCP transitive parser dependency
        run: |
          cd mcp
          go mod tidy
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git add mcp/go.mod mcp/go.sum
            git commit -m "build(m20): lock MCP parser dependency"
            git push
          fi
