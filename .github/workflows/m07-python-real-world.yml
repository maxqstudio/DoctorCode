name: M07 Python Real World

on:
  push:
    branches:
      - "work/m07-python-semantic"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: m07-python-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout DoctorCode
        uses: actions/checkout@v4
        with:
          path: doctorcode
          persist-credentials: false
      - name: Checkout click
        uses: actions/checkout@v4
        with:
          repository: pallets/click
          ref: 06b2a678741131fd577ce170e23e5ca0aeba0309
          path: external/click
          persist-credentials: false
      - name: Checkout httpx
        uses: actions/checkout@v4
        with:
          repository: encode/httpx
          ref: b5addb64f0161ff6bfe94c124ef76f6a1fba5254
          path: external/httpx
          persist-credentials: false
      - name: Checkout requests
        uses: actions/checkout@v4
        with:
          repository: psf/requests
          ref: 611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60
          path: external/requests
          persist-credentials: false
      - name: Checkout flask
        uses: actions/checkout@v4
        with:
          repository: pallets/flask
          ref: d73fa1cdcbd8b1465c151db8924ba58b1dd14e35
          path: external/flask
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: doctorcode/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate pinned public Python repositories
        working-directory: doctorcode
        env:
          DOCTORCODE_M07_CLICK: external/click
          DOCTORCODE_M07_HTTPX: external/httpx
          DOCTORCODE_M07_REQUESTS: external/requests
          DOCTORCODE_M07_FLASK: external/flask
        run: go test ./internal/realworld -run TestM07PinnedPythonRepositories -v
