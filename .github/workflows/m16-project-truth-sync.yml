name: M16 Project Truth Sync

on:
  push:
    branches:
      - "work/m16-thin-mcp-adapter"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/m16-thin-mcp-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Remove temporary workflow from intended final tree
        run: git rm .github/workflows/m16-project-truth-sync.yml

      - name: Generate M16 sequence actual
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --root .
          --output-json docs/sequence/generated/M16-THIN-MCP-ADAPTER.actual.json
          --output-mermaid docs/sequence/generated/M16-THIN-MCP-ADAPTER.actual.mmd

      - name: Synchronize generated Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .

      - name: Commit intended final M16 tree locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m16): synchronize thin MCP project truth"

      - name: Validate clean intended M16 tree
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          python .workflow/tools/validate_sequence_contract.py --root . --session docs/sequence/sessions/M16-THIN-MCP-ADAPTER.json
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_cross_document_consistency.py --base b0677e43c3c5634dbdd856821c44fce7003c896d --require-base
          python .workflow/tools/validate_project_truth.py

      - name: Prepare connector-safe non-workflow commit
        shell: bash
        run: |
          git reset --soft "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --staged --worktree .github/workflows/m16-project-truth-sync.yml
          git add -A
          git commit -m "docs(m16): synchronize thin MCP project truth"

      - name: Push synchronized M16 truth
        run: git push origin HEAD:work/m16-thin-mcp-adapter
