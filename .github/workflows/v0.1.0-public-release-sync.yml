name: v0.1.0 Public Release Truth Sync

on:
  push:
    branches:
      - "work/v0.1.0-public-release-closure"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.1.0-public-release-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Synchronize generated Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .
      - name: Commit generated truth locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow/acceptance.json .workflow/generated docs
          if git diff --cached --quiet; then
            echo "GENERATED_TRUTH_DRIFT=NONE"
          else
            git commit -m "docs: synchronize v0.1.0 public release truth"
          fi
      - name: Validate clean public release closure
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_cross_document_consistency.py --base d36411628d380b3c8d91feec85e65257e7871d51 --require-base
          python .workflow/tools/validate_project_truth.py
      - name: Push synchronized truth
        shell: bash
        run: git push origin HEAD:work/v0.1.0-public-release-closure
