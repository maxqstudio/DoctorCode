name: Temporary M26 Bind BEFORE Plan

on:
  push:
    branches:
      - work/m26-dart-flutter-semantic

permissions:
  contents: write

concurrency:
  group: tmp-m26-bind-before-plan
  cancel-in-progress: true

jobs:
  bind-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/m26-dart-flutter-semantic
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bind M26 BEFORE session and acceptance inputs
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path

          plan_path = Path('docs/sequence/plans/M26-DART-FLUTTER-SEMANTIC-BASELINE.plan.json')
          plan_sha = hashlib.sha256(plan_path.read_bytes()).hexdigest()
          assert plan_sha == 'bfec2e55b4fdab4da32b1e25e06b3a2d2eab06161b04dafb19dd7699e302c1cb', plan_sha

          session = {
            'schema_version': 1,
            'session_id': 'M26-DART-FLUTTER-SEMANTIC-BASELINE',
            'phase': 'M26_DART_FLUTTER_SEMANTIC_BASELINE',
            'mode': 'BEFORE',
            'scope': 'CURRENT',
            'critical': False,
            'status': 'IN_PROGRESS',
            'implementation_base_sha': 'bb1ccefd9969a3db9308bb209ac60d0e19f68930',
            'plan': {
              'required': True,
              'contract': 'docs/sequence/plans/M26-DART-FLUTTER-SEMANTIC-BASELINE.plan.json',
              'frozen': True,
              'frozen_commit': 'bb1ccefd9969a3db9308bb209ac60d0e19f68930',
              'sha256': plan_sha,
              'diagram': 'docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.plan.mmd'
            },
            'actual': {
              'graph': 'docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.json',
              'diagram': 'docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.mmd',
              'source_digest': '',
              'entries': []
            },
            'test_traceability_required': True,
            'tests': ['internal/benchmark/testdata/m26-dart-flutter.json', 'internal/analyzers/dart/analyzer_test.go'],
            'runtime_trace': {'required': False, 'graph': ''},
            'acceptance_report': '',
            'evidence_boundary': 'M26 BEFORE plan was frozen at bb1ccefd9969a3db9308bb209ac60d0e19f68930 before Dart/Flutter product implementation. DOCUMENT edges are design traceability only; behavioral authority must come from RED/green benchmark and cumulative multi-OS CI evidence. Flutter/pubspec and generated-code boundaries are visible-source evidence only. Historical M19-M25 sequence evidence remains content-addressed and immutable under SW2-16 Historical Evidence Freeze.'
          }
          sp = Path('docs/sequence/sessions/M26-DART-FLUTTER-SEMANTIC-BASELINE.json')
          sp.parent.mkdir(parents=True, exist_ok=True)
          sp.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          state_path = Path('.workflow/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['status'] = 'M26_PLANNED_RED_PENDING'
          state['working_branch'] = 'work/m26-dart-flutter-semantic'
          state['next_authorized_actions'] = [
            'Declare a Dart/Flutter labeled, adversarial, and Flutter-shaped RED corpus plus permanent Core CI gate before implementing the Dart analyzer.',
            'Prove the Dart benchmark analyzer absent on Ubuntu, Windows, and macOS at one exact RED SHA.',
            'Only after valid 3-OS RED may Dart/Flutter analyzer implementation begin within the frozen M26 semantic boundary.'
          ]
          proof = 'M26 prerequisite SW2-16 Historical Evidence Freeze is accepted at main bc3846e6d5c412ebe09146a66661d2c49072889b; M25 is content-addressed against frozen commit 749c0883d1f9dba64f1dc301cc69324c3382abf7 and exact main passed all eight permanent workflows.'
          if proof not in state['proven']:
            state['proven'].append(proof)
          provider = 'M26 parser/provider selection is gotreesitter v0.55.1 standalone grammars/dart with registered .dart extension and Dart external-scanner support, preserving embedded pure-Go source-only syntax authority.'
          if provider not in state['proven']:
            state['proven'].append(provider)
          for item in [
            'M26 Dart/Flutter DEADCODE and BLOAT authority are not proven and remain unavailable.',
            'M26 does not prove pub dependency resolution, build_runner/source-generator execution, Flutter widget lifecycle or navigation semantics, dynamic invocation, whole-program reachability, tree-shaking, safe autofix, or automatic deletion.',
            'M26 Flutter/project awareness may represent pubspec presence and generated-code boundaries but must fail closed rather than infer unproven build or framework semantics.'
          ]:
            if item not in state['not_proven']:
              state['not_proven'].append(item)
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          acceptance_path = Path('.workflow/acceptance.json')
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          acceptance['sequence_mode'] = 'BEFORE'
          acceptance['sequence_session'] = 'M26-DART-FLUTTER-SEMANTIC-BASELINE'
          acceptance['evidence_boundary'] = 'M25 is accepted and frozen as historical evidence under SW2-16. M26 BEFORE plan is frozen at bb1ccefd9969a3db9308bb209ac60d0e19f68930 before Dart/Flutter implementation. M26 reuses gotreesitter v0.55.1 Dart as embedded pure-Go syntax authority, but no Dart/Flutter semantic capability is accepted yet. pub/build_runner/source-generator/widget-lifecycle/navigation/whole-program/tree-shaking/DEADCODE/BLOAT semantics, safe autofix, and automatic deletion remain outside authority.'
          ids = {item.get('id') for item in acceptance.get('requirements', [])}
          requirements = [
            {
              'id':'M26-HISTORICAL-FREEZE',
              'requirement':'M26 must begin only after accepted M25 sequence evidence is frozen under SW2-16 and exact freeze-main passes permanent acceptance.',
              'status':'PASS',
              'evidence':'M25 sequence evidence is HISTORICAL in the SW2-16 manifest frozen at 749c0883d1f9dba64f1dc301cc69324c3382abf7; normal-merge main bc3846e6d5c412ebe09146a66661d2c49072889b preserves that commit as reachable ancestry and passed all eight permanent workflows.'
            },
            {
              'id':'M26-BEFORE-PLAN',
              'requirement':'M26 Dart/Flutter flow and unsafe-claim boundaries must be frozen before product implementation.',
              'status':'PASS',
              'evidence':'docs/sequence/plans/M26-DART-FLUTTER-SEMANTIC-BASELINE.plan.json SHA-256 bfec2e55b4fdab4da32b1e25e06b3a2d2eab06161b04dafb19dd7699e302c1cb was committed at bb1ccefd9969a3db9308bb209ac60d0e19f68930 before any M26 product implementation.'
            },
            {
              'id':'M26-PARSER-PROVIDER',
              'requirement':'M26 must select a deterministic cross-platform Dart parser/provider without introducing CGO or requiring Dart/Flutter runtime execution for syntax parsing.',
              'status':'PASS',
              'evidence':'Pinned github.com/odvcencio/gotreesitter v0.55.1 contains grammars/dart/dart.go, .dart registry support, and Dart external-scanner support; M26 will reuse that embedded provider.'
            }
          ]
          for req in requirements:
            if req['id'] not in ids:
              acceptance.setdefault('requirements', []).append(req)
          acceptance_path.write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
      - name: Generate canonical plan diagram
        run: >-
          python .workflow/tools/generate_sequence_plan.py
          --plan docs/sequence/plans/M26-DART-FLUTTER-SEMANTIC-BASELINE.plan.json
          --output docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.plan.mmd
      - name: Generate current ACTUAL baseline
        run: >-
          python .workflow/tools/generate_sequence_actual.py
          --output-json docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.json
          --output-mermaid docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.mmd
      - name: Bind generated ACTUAL digest into session
        shell: python
        run: |
          import json
          from pathlib import Path
          sp = Path('docs/sequence/sessions/M26-DART-FLUTTER-SEMANTIC-BASELINE.json')
          ap = Path('docs/sequence/generated/M26-DART-FLUTTER-SEMANTIC-BASELINE.actual.json')
          session = json.loads(sp.read_text(encoding='utf-8'))
          actual = json.loads(ap.read_text(encoding='utf-8'))
          session['actual']['source_digest'] = actual['source_digest']
          session['actual']['entries'] = actual.get('entries', [])
          sp.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
      - name: Remove temporary workflow before final sync
        run: rm .github/workflows/tmp-m26-bind-before-plan.yml
      - name: Synchronize Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .
      - name: Validate pre-commit M26 plan truth
        shell: bash
        run: |
          python .workflow/tools/validate_schema_toolchain.py --root .
          python .workflow/tools/validate_repository_health.py --root . --require-owner-approved-license
          python .workflow/tools/validate_project_docs.py --root .
          python .workflow/tools/validate_doc_quality.py --root .
          python .workflow/tools/validate_human_comprehension.py --root . --require-pass
          python .workflow/tools/validate_handoff.py --root .
      - name: Commit M26 plan binding locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(m26): bind frozen Dart Flutter BEFORE plan"
      - name: Validate clean committed M26 plan
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          python .workflow/tools/validate_cross_document_consistency.py --base bb1ccefd9969a3db9308bb209ac60d0e19f68930 --require-base
          python .workflow/tools/validate_project_truth.py --root .
          python .workflow/tools/validate_sequence_sessions.py --root .
      - name: Push validated M26 plan binding
        run: git push origin HEAD:work/m26-dart-flutter-semantic
