name: M06 Real World Discovery

on:
  push:
    branches:
      - "work/m06-realworld-labeled"

permissions:
  contents: read

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DoctorCode
        uses: actions/checkout@v4
        with:
          path: doctorcode
          persist-credentials: false
      - name: Checkout urfave-cli
        uses: actions/checkout@v4
        with:
          repository: urfave/cli
          ref: 58ec406eff149315193d8632c08317f70f6deee1
          path: external/urfave-cli
          persist-credentials: false
      - name: Checkout zerolog
        uses: actions/checkout@v4
        with:
          repository: rs/zerolog
          ref: 5eb5f3a76c09eeadc1f2464baf4a4e3f1037c830
          path: external/zerolog
          persist-credentials: false
      - name: Checkout mux
        uses: actions/checkout@v4
        with:
          repository: gorilla/mux
          ref: db9d1d0073d27a0a2d9a8c1bc52aa0af4374d265
          path: external/mux
          persist-credentials: false
      - name: Checkout logrus
        uses: actions/checkout@v4
        with:
          repository: sirupsen/logrus
          ref: 6d6a132bc03324d4ceb78e1b927f995d014cda20
          path: external/logrus
          persist-credentials: false
      - name: Checkout fsnotify
        uses: actions/checkout@v4
        with:
          repository: fsnotify/fsnotify
          ref: 20b1e15ef3c70caeb37ea2bd184f48ef8382669e
          path: external/fsnotify
          persist-credentials: false
      - name: Checkout color
        uses: actions/checkout@v4
        with:
          repository: fatih/color
          ref: 820c6ebc21b06a3a5328297d556a87f91556e577
          path: external/color
          persist-credentials: false
      - name: Checkout pterm
        uses: actions/checkout@v4
        with:
          repository: pterm/pterm
          ref: bacb2fc434b361b8951d1c7649c2029b1d7b6a83
          path: external/pterm
          persist-credentials: false
      - name: Checkout validator
        uses: actions/checkout@v4
        with:
          repository: go-playground/validator
          ref: 3487babb14631e6cc37121799c58ba2281598edd
          path: external/validator
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: doctorcode/go.mod
          cache: false
      - name: Build DoctorCode
        working-directory: doctorcode
        run: go build -trimpath -o ../doctorcode-bin ./cmd/doctorcode
      - name: Discover candidate findings
        shell: bash
        run: |
          set -euo pipefail
          for repo in urfave-cli zerolog mux logrus fsnotify color pterm validator; do
            echo "=== DISCOVERY:${repo} ==="
            ./doctorcode-bin audit "external/${repo}" --json --max-findings=200
          done
