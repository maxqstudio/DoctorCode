name: Temporary M24 Main Acceptance Closure

on:
  push:
    branches:
      - work/m24-main-acceptance-closure

permissions:
  contents: write

concurrency:
  group: tmp-m24-main-acceptance-closure
  cancel-in-progress: true

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/m24-main-acceptance-closure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply M24 acceptance closure transaction
        shell: python
        run: |
          import json
          from pathlib import Path

          product_sha = "a000c0f4afa7bb88789efc63301a9187ff5bb7dd"
          repaired_main_sha = "967baad0210f44b67699b764386fdd79c2ebbcfa"
          m25 = "M25_CSHARP_DOTNET_SEMANTIC_BASELINE"

          state_path = Path('.workflow/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['phase'] = m25
          state['status'] = 'M24_MAIN_ACCEPTED'
          state['last_accepted_branch'] = 'main'
          state['last_accepted_sha'] = product_sha
          state['working_branch'] = 'main'
          state['next_authorized_actions'] = [
              'Begin M25 C#/.NET semantic baseline planning from accepted M24 product authority main@a000c0f4afa7bb88789efc63301a9187ff5bb7dd and governance-normalized main@967baad0210f44b67699b764386fdd79c2ebbcfa.',
              'Select and prove a deterministic C# parser/provider plus project/solution and generated-code boundaries before implementation.',
              'Establish RED labeled/adversarial/repository-shaped evidence before widening C# semantic authority.'
          ]
          stale = 'M24 is not MAIN_ACCEPTED until the SW2-16 governance repair passes exact-branch acceptance, merges to main, and the exact repaired main SHA passes all eight permanent workflows.'
          state['not_proven'] = [x for x in state.get('not_proven', []) if x != stale]
          proofs = [
              'M24 product authority is squash product main@a000c0f4afa7bb88789efc63301a9187ff5bb7dd; accepted branch ef32ff08735ddc9b83889d580daa60f303015ca1 has the identical tree eaafc0655680964a74a8d2898e5976205a57185e.',
              'M24 SW2-16 governance repair branch 42e2b0f10c1237417b2feb67aa1f84a01b4de8b0 passed Governance 37255224234, CI 37255224364, M06 37255224317, Real World Go 37255224282, M07 37255224195, M10 37255224241, M16 37255224251, and M17 37255224256 before guarded squash merge.',
              'M24 governance-normalized main@967baad0210f44b67699b764386fdd79c2ebbcfa passed Governance 37260312927, CI 37260312967, M06 37260312970, Real World Go 37260312979, M07 37260312956, M10 37260312895, M16 37260313017, and M17 37260313136; all eight permanent workflows completed success.'
          ]
          for proof in proofs:
              if proof not in state.setdefault('proven', []):
                  state['proven'].append(proof)
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          roadmap_path = Path('.workflow/roadmap.json')
          roadmap = json.loads(roadmap_path.read_text(encoding='utf-8'))
          roadmap['current_phase'] = m25
          for phase in roadmap['phases']:
              if phase['id'] == 'M24_C_CPP_SEMANTIC_BASELINE':
                  phase['status'] = 'ACCEPTED'
              elif phase['id'] == m25:
                  phase['status'] = 'CURRENT'
          roadmap_path.write_text(json.dumps(roadmap, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          acceptance_path = Path('.workflow/acceptance.json')
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          acceptance['evidence_boundary'] = (
              'M24 is MAIN_ACCEPTED with C/C++ product authority main@a000c0f4afa7bb88789efc63301a9187ff5bb7dd. '
              'The accepted branch ef32ff08735ddc9b83889d580daa60f303015ca1 and squash product merge have identical tree '
              'eaafc0655680964a74a8d2898e5976205a57185e. SW2-16 governance provenance repair is accepted at '
              'main@967baad0210f44b67699b764386fdd79c2ebbcfa with all eight permanent workflows PASS. '
              'M24 authority remains bounded to direct-literal SECURITY, opposite-boolean SIMPLIFY, and duplicate '
              'unmodified bool/_Bool-parameter LOGIC; DEADCODE, BLOAT, macro expansion, compile-definition/target '
              'selection, whole-program linkage, ambiguous standalone .h dialect inference, safe autofix, and automatic '
              'deletion remain outside authority. Current phase is M25_CSHARP_DOTNET_SEMANTIC_BASELINE; no C#/.NET '
              'semantic capability is accepted yet.'
          )
          req_id = 'M24-MAIN-POST-MERGE'
          requirement = {
              'id': req_id,
              'requirement': 'M24 product and repaired governance main must preserve the accepted C/C++ product tree and pass the complete permanent acceptance matrix before M24 closure.',
              'status': 'PASS',
              'evidence': 'Product main a000c0f4afa7bb88789efc63301a9187ff5bb7dd preserved all seven non-governance lanes; SW2-16 repaired provenance without product changes. Repair branch 42e2b0f10c1237417b2feb67aa1f84a01b4de8b0 passed 8/8 PR checks, and governance-normalized main@967baad0210f44b67699b764386fdd79c2ebbcfa passed Governance 37260312927, CI 37260312967, M06 37260312970, Real World Go 37260312979, M07 37260312956, M10 37260312895, M16 37260313017, and M17 37260313136.'
          }
          existing = {item.get('id') for item in acceptance.get('requirements', [])}
          if req_id not in existing:
              acceptance.setdefault('requirements', []).append(requirement)
          acceptance_path.write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          session_path = Path('docs/sequence/sessions/M24-C-CPP-SEMANTIC-BASELINE.json')
          session = json.loads(session_path.read_text(encoding='utf-8'))
          session['scope'] = 'HISTORICAL'
          session['status'] = 'ACCEPTED'
          session['evidence_boundary'] = (
              session.get('evidence_boundary', '') +
              ' Product authority is main@a000c0f4afa7bb88789efc63301a9187ff5bb7dd; exact-tree SQUASH provenance '
              'is accepted under SW2-16, and governance-normalized main@967baad0210f44b67699b764386fdd79c2ebbcfa '
              'passed all eight permanent workflows before closure.'
          ).strip()
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
      - name: Remove temporary closure workflow before truth sync
        shell: bash
        run: rm .github/workflows/tmp-m24-main-acceptance-closure.yml
      - name: Synchronize closure Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .
      - name: Commit closure locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(m24): close main acceptance and advance to M25"
      - name: Validate clean closure tree
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          python .workflow/tools/validate_schema_toolchain.py --root .
          python .workflow/tools/validate_repository_health.py --root . --require-owner-approved-license
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_handoff.py
          python .workflow/tools/validate_cross_document_consistency.py --base cd05f064e1bb1054271e7028941c1fbb80ea32aa --require-base
          python .workflow/tools/validate_project_truth.py
          python .workflow/tools/validate_sequence_sessions.py
      - name: Push validated closure
        run: git push origin HEAD:work/m24-main-acceptance-closure
