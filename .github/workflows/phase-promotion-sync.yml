name: Phase Promotion Doc Sync

on:
  push:
    branches:
      - "work/m08-python-adversarial"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Synchronize Project Truth docs
        run: python .workflow/tools/sync_project_truth.py
      - name: Commit synchronized docs
        shell: bash
        run: |
          git add docs .workflow/generated .workflow/acceptance.json
          if git diff --cached --quiet; then
            echo "No generated documentation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync accepted-phase delivery policy"
          git push origin HEAD:"$GITHUB_REF_NAME"
