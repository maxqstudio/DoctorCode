name: CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: core-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build -trimpath ./cmd/doctorcode
      - name: Scan smoke test
        run: go run ./cmd/doctorcode scan . --json
      - name: Toolchain detection smoke test
        run: go run ./cmd/doctorcode toolchains . --json
