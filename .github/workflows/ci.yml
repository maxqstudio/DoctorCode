name: CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: core-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit and corpus tests
        run: go test ./...
      - name: Precision benchmark gate
        run: go run ./cmd/doctorcode benchmark internal/benchmark/testdata/manifest.json --json
      - name: M03 adversarial benchmark gate
        run: go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m03-adversarial.json --json
      - name: M04 repository-shaped benchmark gate
        run: go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m04-repository-shaped.json --json
      - name: M07 Python semantic benchmark gate
        run: go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m07-python.json --analyzer=python --json
      - name: M08 Python adversarial benchmark gate
        run: go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m08-python-adversarial.json --analyzer=python --json
      - name: M09 Python repository-shaped benchmark gate
        run: go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m09-python-repository-shaped.json --analyzer=python --json
      - name: M18 JavaScript TypeScript semantic benchmark gate
        run: go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m18-js-ts.json --analyzer=javascript --json
      - name: M19 JavaScript TypeScript logic benchmark gate
        run: go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m19-js-ts-logic.json --analyzer=javascript --json
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build -trimpath ./cmd/doctorcode
      - name: Scan smoke test
        run: go run ./cmd/doctorcode scan . --json
      - name: Toolchain detection smoke test
        run: go run ./cmd/doctorcode toolchains . --json
      - name: Audit smoke test
        run: go run ./cmd/doctorcode audit . --json --max-findings=10
      - name: Bounded next-finding smoke test
        run: go run ./cmd/doctorcode next . --json --max-bytes=4096
      - name: Finding-specific related context smoke test
        shell: bash
        run: |
          rm -rf .doctorcode-context-smoke
          mkdir .doctorcode-context-smoke
          printf 'package smoke\n\nfunc decision(flag bool) bool {\n\tif flag {\n\t\treturn true\n\t} else {\n\t\treturn false\n\t}\n}\n\nfunc useDecision() bool { return decision(true) }\n' > .doctorcode-context-smoke/sample.go
          printf 'package smoke\n\nimport "testing"\n\nfunc TestDecision(t *testing.T) {\n\t_ = decision(false)\n}\n' > .doctorcode-context-smoke/sample_test.go
          finding_id="$(go run ./cmd/doctorcode audit .doctorcode-context-smoke --json --max-findings=20 | python -c 'import json,sys; data=json.load(sys.stdin); print(next(item["id"] for item in data["findings"] if item["rule_id"] == "GO-SIMPLIFY-BOOL-RETURN"))')"
          test -n "$finding_id"
          go run ./cmd/doctorcode context "$finding_id" .doctorcode-context-smoke --json --max-bytes=4096 | python -c 'import json,sys; raw=sys.stdin.read(); packet=json.loads(raw); assert packet["schema_version"] == 2; assert packet["finding"]["id"] == sys.argv[1]; assert packet["budget_bytes"] == 4096; assert packet["related_total"] == 2; assert [item["kind"] for item in packet["related_excerpts"]] == ["reference","test_reference"]; assert len(raw.encode()) <= 4096' "$finding_id"
          rm -rf .doctorcode-context-smoke
      - name: Python related context smoke test
        shell: bash
        run: |
          rm -rf .doctorcode-context-smoke-py
          mkdir -p .doctorcode-context-smoke-py/src/pkg .doctorcode-context-smoke-py/tests
          printf 'def _decision(flag):\n    if flag:\n        return True\n    else:\n        return False\n\ndef caller():\n    return _decision(True)\n' > .doctorcode-context-smoke-py/src/pkg/core.py
          printf 'from pkg.core import _decision\n\ndef test_decision():\n    assert _decision(False) is False\n' > .doctorcode-context-smoke-py/tests/test_core.py
          finding_id="$(go run ./cmd/doctorcode audit .doctorcode-context-smoke-py --json --max-findings=20 | python -c 'import json,sys; data=json.load(sys.stdin); print(next(item["id"] for item in data["findings"] if item["rule_id"] == "PY-SIMPLIFY-BOOL-RETURN"))')"
          test -n "$finding_id"
          go run ./cmd/doctorcode context "$finding_id" .doctorcode-context-smoke-py --json --max-bytes=4096 | python -c 'import json,sys; raw=sys.stdin.read(); packet=json.loads(raw); assert packet["schema_version"] == 2; assert packet["finding"]["id"] == sys.argv[1]; assert packet["budget_bytes"] == 4096; assert packet["related_total"] == 2; assert [item["kind"] for item in packet["related_excerpts"]] == ["reference","test_reference"]; assert [item["path"] for item in packet["related_excerpts"]] == ["src/pkg/core.py","tests/test_core.py"]; assert len(raw.encode()) <= 4096' "$finding_id"
          rm -rf .doctorcode-context-smoke-py
      - name: Deterministic verification contract smoke test
        shell: bash
        run: |
          rm -rf .doctorcode-verification-smoke
          mkdir .doctorcode-verification-smoke
          printf 'package smoke\n\nfunc decision(flag bool) bool {\n\tif flag {\n\t\treturn true\n\t} else {\n\t\treturn false\n\t}\n}\n' > .doctorcode-verification-smoke/sample.go
          finding_id="$(go run ./cmd/doctorcode audit .doctorcode-verification-smoke --json --max-findings=20 | python -c 'import json,sys; data=json.load(sys.stdin); print(next(item["id"] for item in data["findings"] if item["rule_id"] == "GO-SIMPLIFY-BOOL-RETURN"))')"
          test -n "$finding_id"
          go run ./cmd/doctorcode contract "$finding_id" .doctorcode-verification-smoke --json > .doctorcode-verification-smoke/contract.json

          printf 'package smoke\n\nconst apiToken = "hardcoded-production-token-12345"\n\nfunc decision(flag bool) bool {\n\treturn flag\n}\n' > .doctorcode-verification-smoke/sample.go
          set +e
          go run ./cmd/doctorcode verify .doctorcode-verification-smoke/contract.json .doctorcode-verification-smoke --json > .doctorcode-verification-smoke/fail.json
          verify_status=$?
          set -e
          test "$verify_status" -ne 0
          python -c 'import json; result=json.load(open(".doctorcode-verification-smoke/fail.json", encoding="utf-8")); assert result["passed"] is False; assert result["target_resolved"] is True; assert len(result["new_blocking_findings"]) == 1; assert result["new_blocking_findings"][0]["rule_id"] == "GO-SEC-HARDCODED-CREDENTIAL"'

          printf 'package smoke\n\nfunc decision(flag bool) bool {\n\treturn flag\n}\n' > .doctorcode-verification-smoke/sample.go
          go run ./cmd/doctorcode verify .doctorcode-verification-smoke/contract.json .doctorcode-verification-smoke --json > .doctorcode-verification-smoke/pass.json
          python -c 'import json; result=json.load(open(".doctorcode-verification-smoke/pass.json", encoding="utf-8")); assert result["passed"] is True; assert result["target_resolved"] is True; assert result["target_current_count"] == 0; assert result.get("new_blocking_findings", []) == []'
          rm -rf .doctorcode-verification-smoke
