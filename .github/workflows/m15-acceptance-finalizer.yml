name: M15 Acceptance Finalizer

on:
  push:
    branches:
      - "work/m15-thin-skill-adapter"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/m15-thin-skill-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Record exact M15 acceptance
        shell: python
        run: |
          import json
          from pathlib import Path

          FINAL_SHA = "b32938e13c1de97138edd09b0374bceb51d60b01"

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, data):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes((json.dumps(data, indent=2, sort_keys=True) + "\n").encode("utf-8"))

          state = load(".workflow/state.json")
          state["status"] = "M15_ACCEPTED"
          state["next_authorized_actions"] = [
              "Run final exact-SHA acceptance on the finalized M15 branch tree with no temporary workflow present.",
              "Open and merge the FINAL_ACCEPTED M15 pull request through protected main.",
              "Rerun Governance Bootstrap, Core CI, and every accepted real-world lane on the exact main merge SHA.",
              "After M15_MAIN_ACCEPTED, proceed to the next adapter/release milestone declared by governance."
          ]
          for item in [
              "Final synchronized M15 branch tree " + FINAL_SHA + " passed Governance Bootstrap run 36368457969.",
              "Core CI run 36368457929 at " + FINAL_SHA + " passed on ubuntu-latest, windows-latest, and macos-latest.",
              "M10 Python labels run 36368457958, M07 Python Real World run 36368457921, M06 Go labels run 36368457994, and Real World Go run 36368457915 all passed on Linux, Windows, and macOS at " + FINAL_SHA + "."
          ]:
              if item not in state["proven"]:
                  state["proven"].append(item)
          save(".workflow/state.json", state)

          acceptance = load(".workflow/acceptance.json")
          for item in acceptance["requirements"]:
              if item["id"] == "M15-STRICT-GOVERNANCE-FINAL":
                  item["status"] = "PASS"
                  item["evidence"] = (
                      "At " + FINAL_SHA + ": Governance Bootstrap 36368457969, Core CI 36368457929, "
                      "M10 Python labels 36368457958, M07 Python Real World 36368457921, "
                      "M06 Go labels 36368457994, and Real World Go 36368457915 all completed success; "
                      "every matrix job passed on Linux, Windows, and macOS."
                  )
          acceptance.setdefault("truth_gates", {})["CROSS_DOCUMENT_CONSISTENCY"] = "PASS"
          acceptance["truth_gates"]["PROJECT_STATE_SYNC"] = "PASS"
          save(".workflow/acceptance.json", acceptance)

          session = load("docs/sequence/sessions/M15-THIN-SKILL-ADAPTER.json")
          session["status"] = "ACCEPTED"
          save("docs/sequence/sessions/M15-THIN-SKILL-ADAPTER.json", session)

          changelog = load(".workflow/changelog.json")
          if not any(x.get("title") == "M15 Thin Skill Adapter accepted baseline" for x in changelog["entries"]):
              changelog["entries"].insert(0,{
                  "date":"2026-09-28",
                  "title":"M15 Thin Skill Adapter accepted baseline",
                  "type":"acceptance",
                  "changes":[
                      "Accepted the self-contained DoctorCode Agent Skill as an orchestration-only adapter.",
                      "Accepted pre-repair contract capture and post-repair deterministic verification as mandatory skill workflow order.",
                      "Accepted cross-platform skill contract validation including Windows CRLF checkout behavior.",
                      "Preserved every previously accepted Linux, Windows, and macOS product/regression lane.",
                      "Kept binary installation, MCP transport, safe deletion, and automatic mutation outside M15 authority."
                  ]
              })
          save(".workflow/changelog.json", changelog)

      - name: Remove temporary finalizer from intended final tree
        run: git rm .github/workflows/m15-acceptance-finalizer.yml

      - name: Regenerate M15 sequence actual
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --root .
          --output-json docs/sequence/generated/M15-THIN-SKILL-ADAPTER.actual.json
          --output-mermaid docs/sequence/generated/M15-THIN-SKILL-ADAPTER.actual.mmd

      - name: Synchronize generated Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .

      - name: Commit intended final accepted tree locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m15): finalize accepted thin skill state"

      - name: Validate intended accepted tree
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          python .workflow/tools/validate_sequence_contract.py --root . --session docs/sequence/sessions/M15-THIN-SKILL-ADAPTER.json
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass
          python .workflow/tools/validate_cross_document_consistency.py --base 86c0998bbdb3b6d8c76bbcaf3e48b2ad39d4f198 --require-base
          python .workflow/tools/validate_project_truth.py

      - name: Prepare connector-safe non-workflow commit
        shell: bash
        run: |
          git reset --soft "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --staged --worktree .github/workflows/m15-acceptance-finalizer.yml
          git add -A
          git commit -m "docs(m15): finalize accepted thin skill state"

      - name: Push finalized non-workflow truth
        shell: bash
        run: git push origin HEAD:work/m15-thin-skill-adapter
