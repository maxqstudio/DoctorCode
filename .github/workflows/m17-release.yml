name: M17 Release and Install

on:
  push:
    branches:
      - main
      - "work/**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-release:
    name: m17-release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve release metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-dev"
          fi
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=$build_date" >> "$GITHUB_ENV"
      - name: Build deterministic release bundle
        run: >
          python scripts/build_release.py
          --version "$RELEASE_VERSION"
          --commit "$RELEASE_COMMIT"
          --date "$RELEASE_DATE"
          --output dist
      - name: Verify release manifest and checksums
        run: >
          python scripts/verify_release.py dist
          --version "$RELEASE_VERSION"
          --commit "$RELEASE_COMMIT"
          --date "$RELEASE_DATE"
      - uses: actions/upload-artifact@v4
        with:
          name: doctorcode-release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 7

  install-smoke:
    name: m17-install-${{ matrix.os }}
    needs: build-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: doctorcode-release-bundle
          path: dist
      - name: Install and smoke on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1 -SourceDir dist -InstallDir "$env:RUNNER_TEMP/doctorcode-bin"
          & "$env:RUNNER_TEMP/doctorcode-bin/doctorcode.exe" version --json
          & "$env:RUNNER_TEMP/doctorcode-bin/doctorcode-mcp.exe" --version --json
      - name: Install and smoke on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/install.sh --source-dir dist --install-dir "$RUNNER_TEMP/doctorcode-bin"
          "$RUNNER_TEMP/doctorcode-bin/doctorcode" version --json
          "$RUNNER_TEMP/doctorcode-bin/doctorcode-mcp" --version --json

  publish-release:
    name: m17-publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: doctorcode-release-bundle
          path: dist
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "DoctorCode $GITHUB_REF_NAME"
