name: M11 Project Truth Sync

on:
  push:
    branches:
      - "work/m11-context-compiler"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/m11-context-compiler
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply M11 governance specs
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, data):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          state = load(".workflow/state.json")
          state["phase"] = "M11_CONTEXT_COMPILER_FOUNDATION"
          state["status"] = "M11_VALIDATING"
          state["working_branch"] = "work/m11-context-compiler"
          state["last_accepted_sha"] = "0184e20a563b5f36b2a642fb3f5146c152893f6b"
          state["last_accepted_branch"] = "main"
          state["blockers"] = []
          state["proven"] = [
              "M10 final normalized authority is main@0184e20a563b5f36b2a642fb3f5146c152893f6b.",
              "Skill_Workflow main remains 9e22feddb8f94e8c0f1af6a33e14b64de5068f8f, matching DoctorCode's pinned authority.",
              "M11 RED run 36310954183 at 3cdda28d6377050287c72a62c7b6b9ccf0110f63 proved finding-specific context helpers were absent and evidence.Build accepted both parent traversal and a symlink resolving outside the repository root.",
              "M11 adds doctorcode context <finding-id> [path] and reuses the deterministic byte-bounded evidence packet used by doctorcode next.",
              "M11 evidence source reads resolve repository root and finding path symlinks and reject paths outside the resolved repository root.",
              "Core CI run 36311250640 at 51e07c83cd3c7bf89f61b7125c9b9f5ced2ae956 passed on ubuntu-latest, windows-latest, and macos-latest, including the finding-specific context smoke test.",
              "At the same M11 product candidate, M10 Python labels 36311250627, M07 Python Real World 36311250626, M06 Go labels 36311250646, and Real World Go 36311250636 passed on Linux, Windows, and macOS."
          ]
          state["not_proven"] = [
              "M11 context packets remain single-finding packets and do not compile transitive call graphs, related symbols, tests, or multi-file dependency context.",
              "A finding ID is valid for the current audited source state and M11 does not migrate stale IDs across repository changes.",
              "The byte budget is deterministic but is not an exact token count for an arbitrary model tokenizer.",
              "M11 does not change detector precision claims, confidence levels, or safe_autofix=false semantics.",
              "Path containment blocks ordinary traversal and resolved symlink escape at packet construction time; it is not a claim against every filesystem race on a hostile local host."
          ]
          state["next_authorized_actions"] = [
              "Generate and validate the M11 CURRENT sequence plus deterministic Project Truth.",
              "Run final exact-SHA Governance Bootstrap, Core CI, and every previously accepted real-world lane.",
              "After FINAL_ACCEPTED, merge M11 to main immediately and rerun all applicable acceptance lanes on the exact main merge SHA."
          ]
          state["blocked_actions"] = [
              "Adding a third semantic language during M11.",
              "Expanding M11 into arbitrary multi-file dependency or whole-program context inference.",
              "Treating a context packet as proof that code is safe to delete or auto-fix.",
              "Starting MCP or Skill adapter product logic before the deterministic context core is accepted."
          ]
          save(".workflow/state.json", state)

          acceptance = load(".workflow/acceptance.json")
          acceptance["evidence_boundary"] = "M11 Context Compiler Foundation adds exact finding-ID packet retrieval plus repository-root containment for evidence source reads. RED run 36310954183 proved the missing selector and traversal/symlink escapes before repair. Product candidate 51e07c83cd3c7bf89f61b7125c9b9f5ced2ae956 passed Core CI and every accepted real-world lane across Linux, Windows, and macOS. M11 remains single-finding, byte-bounded, LLM-optional, and does not introduce safe deletion, auto-fix, stale-ID migration, or multi-file dependency inference."
          acceptance["sequence_mode"] = "DURING"
          acceptance["sequence_session"] = "M11-CONTEXT-COMPILER"
          acceptance["sequence_sync_status"] = "PASS"
          acceptance["runtime_status"] = "PASS"
          acceptance["runtime_checks"] = [
              "go test ./...",
              "Core CI finding-specific context smoke: isolated Go fixture -> audit exact finding ID -> context same ID -> validate bounded JSON packet",
              "go run ./cmd/doctorcode audit . --json --max-findings=10",
              "go run ./cmd/doctorcode next . --json --max-bytes=4096",
              "go test ./internal/realworld -run TestPinnedPublicRepositories -v with exact-SHA Go public paths",
              "go test ./internal/realworld -run TestM06LabeledRealWorld -v with exact-SHA bounded Go label paths",
              "go test ./internal/realworld -run TestM07PinnedPythonRepositories -v with exact-SHA Python public paths",
              "go test ./internal/realworld -run TestM10LabeledPythonRealWorld -v with exact-SHA bounded Python label paths"
          ]
          acceptance["test_commands"] = [
              "go test ./...",
              "go run ./cmd/doctorcode benchmark internal/benchmark/testdata/manifest.json --json",
              "go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m03-adversarial.json --json",
              "go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m04-repository-shaped.json --json",
              "go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m07-python.json --analyzer=python --json",
              "go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m08-python-adversarial.json --analyzer=python --json",
              "go run ./cmd/doctorcode benchmark internal/benchmark/testdata/m09-python-repository-shaped.json --analyzer=python --json",
              "go test ./internal/realworld -run TestM10LabeledPythonRealWorld -v",
              "go vet ./...",
              "go build -trimpath ./cmd/doctorcode",
              "Core CI finding-specific context smoke test"
          ]
          acceptance["requirements"] = [
              {
                  "id": "M11-MAIN-BASELINE",
                  "requirement": "M11 must branch from the exact final accepted M10 main authority and retain the pinned Skill_Workflow authority.",
                  "evidence": "work/m11-context-compiler was created from main@0184e20a563b5f36b2a642fb3f5146c152893f6b; Skill_Workflow remains 9e22feddb8f94e8c0f1af6a33e14b64de5068f8f.",
                  "status": "PASS"
              },
              {
                  "id": "M11-RED-EVIDENCE",
                  "requirement": "Context selection and filesystem boundary weaknesses must be demonstrated before repair.",
                  "evidence": "Core CI run 36310954183 at 3cdda28d6377050287c72a62c7b6b9ccf0110f63 failed because parseContextArgs/findFindingByID were absent and both traversal/symlink escape tests demonstrated escaped reads.",
                  "status": "PASS"
              },
              {
                  "id": "M11-EXACT-FINDING-CONTEXT",
                  "requirement": "doctorcode context must select one exact current audit finding by deterministic finding ID and build a bounded packet for that finding.",
                  "evidence": "cmd/doctorcode/main_test.go covers exact selection and the audit-select-packet pipeline; Core CI run 36311250640 passed the finding-specific CLI smoke on all three operating systems.",
                  "status": "PASS"
              },
              {
                  "id": "M11-FILESYSTEM-BOUNDARY",
                  "requirement": "Evidence source excerpts must not read outside the resolved repository root through traversal or symlink escape.",
                  "evidence": "internal/evidence/packet_test.go contains blocking traversal and symlink escape tests; sourceExcerpt resolves and checks the path before os.ReadFile. Core CI 36311250640 passed on Linux, Windows, and macOS.",
                  "status": "PASS"
              },
              {
                  "id": "M11-REGRESSION-MATRIX",
                  "requirement": "M11 must preserve all accepted detector and public-source regression lanes across Linux, Windows, and macOS.",
                  "evidence": "At 51e07c83cd3c7bf89f61b7125c9b9f5ced2ae956: Core CI 36311250640, M10 Python labels 36311250627, M07 Python Real World 36311250626, M06 Go labels 36311250646, and Real World Go 36311250636 passed across all three operating systems.",
                  "status": "PASS"
              },
              {
                  "id": "M11-STRICT-GOVERNANCE-FINAL",
                  "requirement": "Generated Project Truth and M11 sequence artifacts must pass strict governance on the final exact M11 branch SHA after temporary workflows are removed.",
                  "evidence": "NOT_PROVEN until the synchronized final candidate is checked.",
                  "status": "NOT_PROVEN"
              }
          ]
          for key in ("DOC_LAYOUT", "PROJECT_DOCS_NORMALIZED", "DOC_READABILITY", "PROJECT_DOCS_SYNC", "CROSS_DOCUMENT_CONSISTENCY", "PROJECT_STATE_SYNC"):
              acceptance.setdefault("truth_gates", {})[key] = "NOT_PROVEN"
          acceptance["truth_gates"]["SEQUENCE_SYNC"] = "PASS"
          save(".workflow/acceptance.json", acceptance)

          claims = load(".workflow/claims.json")
          known = {x["id"] for x in claims["claims"]}
          additions = [
              {
                  "id": "TRUTH-M11-CONTEXT-ID",
                  "claim": "M11 adds doctorcode context <finding-id> [path], which re-audits the current repository, requires an exact current finding ID match, and builds the same deterministic byte-bounded evidence packet used by doctorcode next.",
                  "documents": ["PROJECT_TRUTH_SYNC.md"],
                  "source_owners": ["cmd/doctorcode/main.go", "internal/evidence/packet.go"],
                  "tests": ["cmd/doctorcode/main_test.go", ".github/workflows/ci.yml"],
                  "runtime_evidence": ["GitHub Actions Core CI run 36311250640 at 51e07c83cd3c7bf89f61b7125c9b9f5ced2ae956"],
                  "status": "PASS"
              },
              {
                  "id": "TRUTH-M11-PATH-BOUNDARY",
                  "claim": "M11 evidence source reads reject lexical traversal and resolved symlink escape outside the repository root before reading the excerpt.",
                  "documents": ["PROJECT_TRUTH_SYNC.md"],
                  "source_owners": ["internal/evidence/packet.go"],
                  "tests": ["internal/evidence/packet_test.go"],
                  "runtime_evidence": ["RED Core CI run 36310954183 at 3cdda28d6377050287c72a62c7b6b9ccf0110f63", "GREEN Core CI run 36311250640 at 51e07c83cd3c7bf89f61b7125c9b9f5ced2ae956"],
                  "status": "PASS"
              },
              {
                  "id": "TRUTH-M11-SINGLE-FINDING-BOUNDARY",
                  "claim": "M11 context compilation remains a single-finding packet contract and does not claim transitive multi-file dependency context, stale-ID migration, exact tokenizer counts, safe deletion, or automatic repair.",
                  "documents": ["PROJECT_TRUTH_SYNC.md"],
                  "source_owners": [".workflow/state.json", "internal/evidence/packet.go", "cmd/doctorcode/main.go"],
                  "tests": ["cmd/doctorcode/main_test.go", "internal/evidence/packet_test.go"],
                  "runtime_evidence": ["GitHub Actions Core CI run 36311250640 at 51e07c83cd3c7bf89f61b7125c9b9f5ced2ae956"],
                  "status": "PASS"
              }
          ]
          for item in additions:
              if item["id"] not in known:
                  claims["claims"].append(item)
          save(".workflow/claims.json", claims)

          changelog = load(".workflow/changelog.json")
          if not any(x.get("title") == "M11 Context Compiler Foundation candidate" for x in changelog["entries"]):
              changelog["entries"].insert(0, {
                  "date": "2026-09-27",
                  "title": "M11 Context Compiler Foundation candidate",
                  "type": "development",
                  "changes": [
                      "Added doctorcode context <finding-id> for deterministic retrieval of one current audit finding as a bounded evidence packet.",
                      "Added blocking lexical traversal and symlink-escape tests for evidence source reads.",
                      "Resolved repository root and finding source paths before excerpt reads and reject targets outside the repository boundary.",
                      "Added an end-to-end three-OS CI smoke that audits an isolated fixture, captures its exact finding ID, and requests context for that same ID.",
                      "Kept detector rules, confidence boundaries, safe_autofix=false behavior, and accepted Go/Python real-world lanes unchanged."
                  ]
              })
          save(".workflow/changelog.json", changelog)

          architecture = load(".workflow/architecture.json")
          for component in architecture["components"]:
              if component["id"] == "cli":
                  component["purpose"] = "Human/agent interface for scan, toolchain, audit, highest-priority next-finding, exact finding-specific context, and benchmark operations."
              if component["id"] == "evidence_reducer":
                  component["purpose"] = "Turn a selected deterministic finding into a tokenizer-independent bounded byte packet for small LLMs while enforcing repository-contained source reads."
                  if "repository-contained source path resolution" not in component["owns"]:
                      component["owns"].append("repository-contained source path resolution")
          for flow in architecture["data_flows"]:
              if flow["from"] == "detector engine" and flow["to"] == "evidence reducer":
                  flow["meaning"] = "doctorcode next selects the highest-priority finding; doctorcode context selects one exact current finding ID; both reduce that finding to the same bounded packet."
          if not any(x["name"] == "Evidence source filesystem boundary" for x in architecture["external_boundaries"]):
              architecture["external_boundaries"].append({
                  "name": "Evidence source filesystem boundary",
                  "contract": "Source excerpts are read only after resolving repository root and finding path symlinks and confirming the resolved target remains inside the repository root."
              })
          save(".workflow/architecture.json", architecture)

          decisions = load(".workflow/decisions.json")
          ids = {x["id"] for x in decisions["decisions"]}
          for item in [
              {
                  "id": "ADR-M11-001",
                  "title": "Context selects exact current finding IDs",
                  "status": "ACCEPTED",
                  "decision": "Implement doctorcode context by re-auditing the current repository and selecting an exact finding ID before building the existing bounded evidence packet.",
                  "rationale": "Finding IDs already provide deterministic source-state identity. Reusing audit plus evidence.Build keeps the core small and avoids a second finding store or stale cache."
              },
              {
                  "id": "ADR-M11-002",
                  "title": "Resolve evidence paths before repository containment checks",
                  "status": "ACCEPTED",
                  "decision": "Resolve the repository root and candidate source path through filesystem symlinks, then reject any target whose relative path escapes the resolved root before reading source.",
                  "rationale": "Lexical filepath.Join alone allowed parent traversal and symlink targets outside the repository to expose unrelated local files through evidence packets."
              }
          ]:
              if item["id"] not in ids:
                  decisions["decisions"].append(item)
          save(".workflow/decisions.json", decisions)

          project = load(".workflow/project.json")
          desired = [
              {"name": "doctorcode audit", "path": "cmd/doctorcode/main.go", "purpose": "Run registered deterministic semantic analyzers and emit normalized findings."},
              {"name": "doctorcode next", "path": "cmd/doctorcode/main.go", "purpose": "Return the highest-priority finding as one byte-bounded evidence packet."},
              {"name": "doctorcode context", "path": "cmd/doctorcode/main.go", "purpose": "Re-audit and return one exact finding ID as a repository-contained byte-bounded evidence packet."},
              {"name": "doctorcode benchmark", "path": "cmd/doctorcode/main.go", "purpose": "Evaluate labeled analyzer corpora and enforce deterministic TP/FP/FN regression gates."}
          ]
          existing = {x["name"] for x in project["entry_points"]}
          for item in desired:
              if item["name"] not in existing:
                  project["entry_points"].append(item)
          save(".workflow/project.json", project)

          m10 = load("docs/sequence/sessions/M10-PYTHON-LABELED-REAL-WORLD.json")
          m10["scope"] = "HISTORICAL"
          save("docs/sequence/sessions/M10-PYTHON-LABELED-REAL-WORLD.json", m10)

          save(".workflow/workflows/FLOW-CONTEXT-COMPILER.json", {
              "schema_version": 1,
              "flow_id": "FLOW-CONTEXT-COMPILER",
              "title": "Finding-specific bounded context compilation",
              "purpose": "Convert one exact current audit finding into a byte-bounded evidence packet while preventing source excerpt reads outside the repository root.",
              "authority": "cmd/doctorcode/main.go, internal/evidence/packet.go, cmd/doctorcode/main_test.go, internal/evidence/packet_test.go, and .github/workflows/ci.yml",
              "entry_condition": "Repository is auditable and caller supplies a finding ID emitted by the current source-state audit.",
              "source_owners": ["cmd/doctorcode/main.go", "internal/evidence/packet.go"],
              "states": ["AUDIT_REQUESTED", "FINDING_SELECTED", "PATH_BOUNDARY_VERIFIED", "PACKET_BOUNDED", "REPORTED"],
              "transitions": [
                  {"from": "AUDIT_REQUESTED", "to": "FINDING_SELECTED", "action": "Run deterministic audit and require an exact finding ID match.", "side_effects": []},
                  {"from": "FINDING_SELECTED", "to": "PATH_BOUNDARY_VERIFIED", "action": "For non-security excerpts, resolve repository root and source path and reject escape outside the root.", "side_effects": []},
                  {"from": "PATH_BOUNDARY_VERIFIED", "to": "PACKET_BOUNDED", "action": "Build the existing evidence packet under the caller byte budget.", "side_effects": []},
                  {"from": "PACKET_BOUNDED", "to": "REPORTED", "action": "Emit text or JSON without invoking an LLM or mutating source.", "side_effects": []}
              ],
              "invariants": [
                  "Context lookup uses exact finding ID equality against the current deterministic audit.",
                  "Unknown or stale finding IDs fail closed.",
                  "Non-security excerpts are read only from resolved paths contained inside the resolved repository root.",
                  "Security findings continue to omit source excerpts by default.",
                  "Packet byte budget remains deterministic and tokenizer-independent.",
                  "Context compilation never changes safe_autofix and never mutates analyzed source."
              ],
              "tests": ["cmd/doctorcode/main_test.go", "internal/evidence/packet_test.go", ".github/workflows/ci.yml"],
              "sequence_session": "M11-CONTEXT-COMPILER",
              "critical": False,
              "failure_behavior": ["Audit failure, unknown finding ID, path escape, unreadable selected source, or metadata exceeding the byte budget fails the context request."],
              "restart_behavior": ["The flow is stateless and rerunnable against the same current source state."],
              "rollback_behavior": ["M11 can be reverted without detector changes because context selection is a CLI/evidence-layer extension."]
          })

          save("docs/sequence/sessions/M11-CONTEXT-COMPILER.json", {
              "schema_version": 1,
              "session_id": "M11-CONTEXT-COMPILER",
              "phase": "M11_CONTEXT_COMPILER_FOUNDATION",
              "mode": "DURING",
              "scope": "CURRENT",
              "critical": False,
              "status": "IN_PROGRESS",
              "implementation_base_sha": "0184e20a563b5f36b2a642fb3f5146c152893f6b",
              "plan": {"required": False, "contract": "", "frozen": False, "frozen_commit": "", "sha256": "", "diagram": ""},
              "actual": {
                  "graph": "docs/sequence/generated/M11-CONTEXT-COMPILER.actual.json",
                  "diagram": "docs/sequence/generated/M11-CONTEXT-COMPILER.actual.mmd",
                  "source_digest": "",
                  "entries": []
              },
              "test_traceability_required": True,
              "tests": ["cmd/doctorcode/main_test.go", "internal/evidence/packet_test.go", ".github/workflows/ci.yml"],
              "runtime_trace": {"required": False, "graph": ""},
              "acceptance_report": ""
          })

          gov_path = Path(".github/workflows/governance-bootstrap.yml")
          gov = gov_path.read_text(encoding="utf-8")
          gov = re.sub(
              r"--base\s+[0-9a-f]{40}\s+--require-base",
              "--base 0184e20a563b5f36b2a642fb3f5146c152893f6b --require-base",
              gov,
              count=1,
          )
          gov_path.write_text(gov, encoding="utf-8")

      - name: Remove temporary workflow from final tree
        run: git rm .github/workflows/m11-project-truth-sync.yml

      - name: Generate M11 sequence actual
        run: >
          python .workflow/tools/generate_sequence_actual.py
          --root .
          --output-json docs/sequence/generated/M11-CONTEXT-COMPILER.actual.json
          --output-mermaid docs/sequence/generated/M11-CONTEXT-COMPILER.actual.mmd

      - name: Validate M11 sequence
        run: >
          python .workflow/tools/validate_sequence_contract.py
          --root .
          --session docs/sequence/sessions/M11-CONTEXT-COMPILER.json

      - name: Synchronize generated Project Truth
        run: python .workflow/tools/sync_project_truth.py --root .

      - name: Validate generated artifacts before commit
        run: |
          python .workflow/tools/validate_sequence_sessions.py
          python .workflow/tools/validate_project_docs.py
          python .workflow/tools/validate_doc_quality.py
          python .workflow/tools/validate_human_comprehension.py --require-pass

      - name: Commit synchronized M11 governance
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m11): synchronize context compiler project truth"
          git push origin HEAD:work/m11-context-compiler
